# O gênero office (ADR-0077, ADR-0078): o escritório em tempo real, com o pedido no quadro.
# Os números do cenário (o expediente, os feriados, a porta) ficam no cenário; aqui, o padrão.

clock:
  # 250 ms (ADR-0081): o kernel aplica um comando na virada do tick, e a 1× um tick de 2 s fazia o
  # clique esperar até 2 s e a seta solta passar até 8 tiles do ponto. Os 2 s do M23 eram a medida
  # do custo (ADR-0078, decisão 1), e o custo está nas decisões dos scripts, e não nos ticks.
  tick_seconds: 0.25
  day_starts_at: "00:00" # o dia do calendário: o escritório não tem dia agrícola
  phases:
    madrugada: "00:00"
    manha: "06:00"
    tarde: "12:00"
    noite: "18:00"
  default_scale: 1 # tempo real

movement:
  # O passo de tela (ADR-0079): 4 tiles por segundo na tela, em qualquer escala. O kernel converte
  # pela escala do momento: a 1× é um tile num tick de 250 ms; a 72×, um tile a cada 72 ticks (18 s
  # do mundo). Andar no relógio do mundo (1,2 tile por segundo) virava 86 tiles por segundo a 72×.
  screen_tiles_per_second: 4

perception:
  radius: null # a sala inteira

speech:
  interrupts: true # falar com alguém interrompe o que ele faz, e ele responde (ADR-0080)

ticket:
  title_max: 80
  description_max: 1000
  acceptance_max: 500
  comment_max: 280
  # O tamanho, em minutos de trabalho simulado: no M23, só o dev-script trabalha assim
  # (ADR-0078, decisão 11). A partir do M24 o trabalho é de verdade.
  sizes:
    P: 15
    M: 60
    G: 180
  # Quem programa o pedido e o modelo da sessão, escolhidos na prancheta (ADR-0089; a decisão 14
  # da ADR-0083). Sem escolha, vale o padrão do mundo (`minds.<dev>.hands` e `model`). A tela mostra
  # os nomes de `choices` no locale do gênero, na mesma ordem.
  hands: [api, claude_code]
  models: [claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-2]

# O expediente do dev, em dias da semana de 1 (segunda) a 7 (domingo). O cenário dá os números.
schedule:
  workdays: [1, 2, 3, 4, 5]
  opens: "09:00"
  lunch: ["12:00", "13:00"]
  lunch_where: rua # rua: o dev sai pela porta; copa: almoça na sala (ADR-0080)
  closes: "18:00"
  holidays: {}
  # A convocação (a parte 5 do M25): fora do expediente (as noites, os fins de semana e os
  # feriados), o gerente chama o dev. O cenário a liga; cada dev do elenco pode ter o próprio acordo
  # (`on_call` na linha dele), por cima deste.
  on_call:
    enabled: false
    on_manager_enter: false # o dev vem sozinho quando o gerente entra
    window: ["08:00", "23:00"] # as horas do dia em que vale
    arrive_minutes: 2 # o deslocamento
    max_hours: 6 # o teto de uma convocação

# Quanto dura cada ação, em segundos simulados (o kernel converte em ticks; ADR-0078).
actions:
  write_ticket: { seconds: 20, interrupt: cancel }
  take_ticket: { seconds: 4, interrupt: cancel }
  work: { interrupt: partial } # o tamanho do pedido dá a duração
  deliver: { seconds: 6, interrupt: cancel }
  accept_ticket: { seconds: 6, interrupt: cancel }
  # As pausas da rotina (ADR-0080): ilustrativas, sem efeito no trabalho.
  drink: { seconds: 30, interrupt: cancel }
  coffee: { seconds: 120, interrupt: cancel }
  restroom: { seconds: 240, interrupt: cancel }
  fridge: { seconds: 15, interrupt: cancel } # pegar o almoço na geladeira (ADR-0082)
  microwave: { seconds: 90, interrupt: cancel } # esquentar
  lunch: { interrupt: cancel } # comer, até uns minutos antes do fim da hora do almoço
  trash: { seconds: 5, interrupt: cancel } # jogar fora
  tv: { seconds: 600, interrupt: cancel } # ver TV no sofá (ADR-0082)
  videogame: { seconds: 900, interrupt: cancel } # jogar videogame no sofá
  return_ticket: { seconds: 10, interrupt: cancel }
  # A convocação (a parte 5 do M25): o gerente liga para o dev, ou o dispensa, de onde estiver.
  summon: { seconds: 5, interrupt: cancel }
  dismiss: { seconds: 3, interrupt: cancel }
  # A luz da sala (ADR-0088): no interruptor, ao lado da porta.
  light_on: { seconds: 2, interrupt: cancel }
  light_off: { seconds: 2, interrupt: cancel }

# O temporizador do prédio (ADR-0088): acende a luz da sala e apaga em horas marcadas. No meio, e
# depois, quem está na sala acende e apaga no interruptor.
lights:
  acende: "18:00" # `on` e `off` o YAML lê como booleanos
  apaga: "21:00"

# A linha do tempo (ADR-0068): como cada fato se conta.
labels:
  - event: campsverso.office.ticket.created.v1
    text: "escreveu o pedido {number}: {title}"
  - event: campsverso.office.ticket.taken.v1
    text: "pegou o pedido {number}"
  - event: campsverso.office.ticket.delivered.v1
    text: "entregou o pedido {number}"
  - event: campsverso.office.ticket.accepted.v1
    text: "aceitou o pedido {number}"
  - event: campsverso.office.ticket.returned.v1
    text: "devolveu o pedido {number}: {comment}"
  # O PR do dev no GitHub (ADR-0083): o publicador abre, o vigia relata.
  - event: campsverso.office.ticket.pr_opened.v1
    text: "PR #{pull_request} aberto para o pedido {number}"
  - event: campsverso.office.ticket.pr_updated.v1
    text: "PR #{pull_request} com um commit novo"
  - event: campsverso.office.ticket.pr_updated.v1
    where: { ci: success }
    text: "o CI do PR #{pull_request} passou"
  - event: campsverso.office.ticket.pr_updated.v1
    where: { ci: failure }
    text: "o CI do PR #{pull_request} falhou"
  - event: campsverso.office.ticket.pr_updated.v1
    where: { ci: pending }
    text: "o CI do PR #{pull_request} está rodando"
  - event: campsverso.office.ticket.pr_merged.v1
    text: "PR #{pull_request} mesclado: o pedido {number} foi aceito"
  - event: campsverso.office.ticket.pr_closed.v1
    text: "PR #{pull_request} fechado sem mesclar: o pedido {number} voltou"
  # A troca de versão do escritório vivo (ADR-0083).
  - event: campsverso.world.version.changed.v1
    text: "o escritório subiu numa versão nova do código"
  # A luz da sala (ADR-0088).
  - event: campsverso.office.light.switched.v1
    where: { "on": true }
    text: "acendeu a luz da sala"
  - event: campsverso.office.light.switched.v1
    where: { "on": false }
    text: "apagou a luz da sala"
  # A convocação fora do expediente (a parte 5 do M25).
  - event: campsverso.office.staff.summoned.v1
    where: { origin: entrada }
    text: "convocou o dev ao entrar"
  - event: campsverso.office.staff.summoned.v1
    text: "convocou o dev"
  - event: campsverso.office.staff.dismissed.v1
    where: { reason: dispensado }
    text: "dispensou o dev"
  - event: campsverso.office.staff.dismissed.v1
    where: { reason: saida }
    text: "a convocação do dev acabou: o gerente saiu"
  - event: campsverso.office.staff.dismissed.v1
    where: { reason: teto }
    text: "a convocação do dev chegou ao teto de horas"
  - event: campsverso.office.staff.dismissed.v1
    where: { reason: janela }
    text: "a convocação do dev acabou com a janela do dia"
  - event: campsverso.office.staff.dismissed.v1
    where: { reason: expediente }
    text: "o expediente começou: o dev convocado segue no escritório"
  - event: campsverso.avatar.spoke.v1
    text: "disse: “{text}”"
  - event: campsverso.avatar.entered.v1
    where: { reason: expediente }
    text: "chegou ao escritório"
  - event: campsverso.avatar.entered.v1
    where: { reason: plantao }
    text: "começou o plantão"
  - event: campsverso.avatar.entered.v1
    where: { reason: possessed }
    text: "entrou no escritório"
  - event: campsverso.avatar.entered.v1
    where: { reason: convocacao }
    text: "chegou pelo chamado"
  - event: campsverso.avatar.left.v1
    where: { reason: expediente }
    text: "foi embora"
  - event: campsverso.avatar.left.v1
    where: { reason: almoco }
    text: "saiu para almoçar"
  - event: campsverso.avatar.left.v1
    where: { reason: plantao }
    text: "terminou o plantão"
  - event: campsverso.avatar.left.v1
    where: { reason: released }
    text: "saiu do escritório"
  - event: campsverso.avatar.left.v1
    where: { reason: convocacao }
    text: "foi embora depois do chamado"
  # As pausas da rotina (ADR-0080).
  - event: campsverso.action.accepted.v1
    where: { action: drink }
    text: "foi beber água"
  - event: campsverso.action.accepted.v1
    where: { action: coffee }
    text: "foi tomar um café"
  - event: campsverso.action.accepted.v1
    where: { action: restroom }
    text: "foi ao banheiro"
  - event: campsverso.action.accepted.v1
    where: { action: fridge }
    text: "pegou o almoço na geladeira"
  - event: campsverso.action.accepted.v1
    where: { action: microwave }
    text: "esquentou o almoço no micro-ondas"
  - event: campsverso.action.accepted.v1
    where: { action: lunch }
    text: "almoçou na copa"
  - event: campsverso.action.accepted.v1
    where: { action: trash }
    text: "jogou o resto no lixo"
  - event: campsverso.action.accepted.v1
    where: { action: tv }
    text: "sentou no sofá para ver TV"
  - event: campsverso.action.accepted.v1
    where: { action: videogame }
    text: "sentou no sofá para jogar videogame"

# O menu de quem está no escritório (ADR-0051): as pausas, de qualquer um, ao lado da coisa. A tela
# anda até lá antes. O almoço na mesinha só vale na hora dele; o kernel recusa fora dela.
affordances:
  - { action: drink, label: Beber água, kinds: [water_cooler], target: false }
  - { action: coffee, label: Tomar um café, kinds: [coffee_machine], target: false }
  - { action: fridge, label: Pegar o almoço, kinds: [fridge], target: false }
  - { action: microwave, label: Esquentar o almoço, kinds: [microwave], target: false }
  - { action: lunch, label: Almoçar, kinds: [copa_table], target: false, note: "das 12:00 às 13:00" }
  - { action: trash, label: Jogar fora, kinds: [trash], target: false }
  - { action: restroom, label: Ir ao banheiro, kinds: [restroom_door, restroom], target: false }
  - { action: tv, label: Ver TV, kinds: [sofa, tv], target: false }
  - { action: videogame, label: Jogar videogame, kinds: [sofa, tv], target: false }
  # A luz da sala (ADR-0088): o menu desabilita o que não faz sentido agora; quem decide é o kernel.
  - action: light_on
    label: Acender a luz
    kinds: [light_switch]
    target: false
    requires: [{ attribute: acesa, values: [false, null], hint: "a luz já está acesa" }]
  - action: light_off
    label: Apagar a luz
    kinds: [light_switch]
    target: false
    requires: [{ attribute: acesa, values: [true], hint: "a luz já está apagada" }]

# As métricas do dia (ADR-0054), contadas pela projeção comum.
metrics:
  - { id: pedidos_escritos, label: "pedidos escritos", kind: count, event: campsverso.office.ticket.created.v1 }
  - { id: pedidos_entregues, label: "pedidos entregues", kind: count, event: campsverso.office.ticket.delivered.v1 }
  - { id: pedidos_aceitos, label: "pedidos aceitos", kind: count, event: campsverso.office.ticket.accepted.v1 }
  - { id: pedidos_devolvidos, label: "pedidos devolvidos", kind: count, event: campsverso.office.ticket.returned.v1 }
  - { id: trabalho, label: "segundos de trabalho entregues", kind: count, event: campsverso.office.ticket.delivered.v1, field: worked_seconds }
  - { id: falas, label: "falas", kind: count, event: campsverso.avatar.spoke.v1 }
