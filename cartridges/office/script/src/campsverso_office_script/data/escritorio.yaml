# Os scripts do escritório (ADR-0078). Os números repetem os do gênero office (o tamanho de cada
# pedido), como os fazendeiros-script repetem os da fazenda: o script só lê a foto.

sizes: { P: 15, M: 60, G: 180 } # minutos de trabalho simulado

dev:
  id: script/dev
  chunk_seconds: 60 # trabalha um minuto por vez e, entre um bloco e outro, responde a quem falou
  wait_seconds: 60
  lunch_at: "12:00" # o almoço do cenário (escritorio.yaml do office_campsverso): o dev avisa antes
  # A rotina (ADR-0080): o que o dev faz sem pedido. As pausas são ilustrativas; os horários
  # saem de um sorteio pelo dia, deslocados até `spread_minutes` para mais ou para menos.
  routine:
    lunch: ["12:00", "13:00"] # na copa, como o cenário
    start: "09:20"
    end: "17:40"
    coffee: ["10:00", "15:30"]
    water_every_minutes: 100
    restroom_per_day: 2
    videogame_per_day: 1 # no sofá, à tarde (ADR-0082)
    spread_minutes: 20
    stale_minutes: 60 # a pausa com mais de uma hora de atraso fica para outro dia
  lines:
    morning: "Bom dia!"
    took: "Peguei o pedido {number}: {title}."
    delivered: "Entreguei o pedido {number}: {title}."
    noted: "Anotado."
    lunch: "Hora do almoço. Vou para a copa."

vigia:
  id: script/vigia
  # A ronda: os primeiros minutos de cada hora, passando por estes pontos; o resto, no posto, de
  # pé no corredor, ao lado da porta (a planta da arte nova, ADR-0082).
  round_minutes: 10
  points: [[9, 12], [11, 2], [12, 6], [7, 10], [15, 10]]
  chair: [11, 14]
  wait_seconds: 120
  look_seconds: 30 # parado em cada ponto da ronda, até a vez do próximo (a cada 2 minutos)
  # A luz (ADR-0088): o que ele responde a quem pede, antes de ir ao interruptor.
  lines:
    light_on: "Já vou acender a luz."
    light_off: "Já vou apagar a luz."
    no_switch: "Aqui não tem interruptor."

gerente:
  id: script/gerente
  # O roteiro dos testes: um pedido por horário, todo dia útil; devolve um de cada três.
  tickets:
    - at: "09:30"
      title: "Ferramenta de busca no código"
      description: "Achar um arquivo do repositório pelo nome."
      acceptance: "Achar o CLAUDE.md digitando claude."
      size: P
    - at: "10:30"
      title: "Resumo do diário"
      description: "Um resumo curto do diário do dia."
      acceptance: "Três frases, sem inventar nada."
      size: M
    - at: "14:00"
      title: "Testador"
      description: "Rodar os testes de um caminho e dizer o resultado."
      acceptance: "Mostra quantos passaram e quantos falharam."
      size: P
  greeting: "Bom dia, Camps! Deixei pedidos no quadro."
  return_every: 3
  return_comment: "Falta o teste de aceite. Pode refazer?"
  wait_seconds: 60
