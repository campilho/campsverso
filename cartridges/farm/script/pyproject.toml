[project]
name = "campsverso-farm-script"
version = "0.1.0.dev0"
description = "Fazendeiro-script do cartucho farm. Depende só dos contratos."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "campsverso-contracts",
  "pyyaml>=6",
]

[project.entry-points."campsverso.controllers"]
farmer = "campsverso_farm_script:controller"
farmer2 = "campsverso_farm_script:controller2"
farmer3 = "campsverso_farm_script:controller3"
oracle = "campsverso_farm_script:oracle"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
