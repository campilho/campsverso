# Fazendeiro-script 2 (bíblia 2, §11): a linha de base competente e cega da Fazenda Boa Vista.
# Segue o manual com regras boas e nenhuma regra oculta: cava perto do poço, planta a melhor
# conta visível que o dinheiro permite, guarda comida, vende enquanto o preço do dia compensa,
# compra o regador grande quando sobra. Nunca o arado, nunca o adubo.

id: script/farmer2-v1
wait_ticks: 15

sleep:
  bed_kind: bed
  at: "21:30"
  low_energy: 10
  ground_after: "01:30"
  wake_at: "06:00"

needs: {hunger: fome, energy: energia}
hunger_eat_at: 70
food_days: 2  # comida guardada para dois dias, em pontos de fome (56 por dia)
hunger_per_day: 56

foods:  # comestíveis: valor de venda e quanto tiram de fome (bíblia 2, §5)
  rabanete: {sale: 25, hunger: 25}
  batata: {sale: 50, hunger: 35}
  abobora: {sale: 104, hunger: 50}
  cenoura: {sale: 20, hunger: 15}
  morango: {sale: 90, hunger: 20}
  tomate: {sale: 70, hunger: 30}
  alho: {sale: 40, hunger: 10}
  milho: {sale: 45, hunger: 25}
  melancia: {sale: 120, hunger: 40}
  mandioca: {sale: 80, hunger: 45}
  couve: {sale: 30, hunger: 12}
dishes: [sopa_de_batata, ensopado, pure_de_abobora]  # pratos prontos: come primeiro
soup: {recipe: sopa_de_batata, needs: {batata: 2}}  # cozinha quando tem os ingredientes

crops:  # a conta visível: (venda - semente) / dias; o script planta a melhor que pode comprar
  rabanete: {seed: semente_rabanete, price: 10, days: 3, sale: 25}
  batata: {seed: semente_batata, price: 20, days: 5, sale: 50}
  abobora: {seed: semente_abobora, price: 40, days: 8, sale: 104}
  cenoura: {seed: semente_cenoura, price: 15, days: 4, sale: 20}
  morango: {seed: semente_morango, price: 60, days: 6, sale: 90}
  tomate: {seed: semente_tomate, price: 30, days: 4, sale: 70}
  alho: {seed: semente_alho, price: 12, days: 7, sale: 40}
  milho: {seed: semente_milho, price: 20, days: 6, sale: 45}  # as quatro da Morada do Sol (M16)
  melancia: {seed: semente_melancia, price: 35, days: 8, sale: 120}
  mandioca: {seed: semente_mandioca, price: 25, days: 10, sale: 80}
  couve: {seed: semente_couve, price: 12, days: 4, sale: 30}

digging: {plots: 16, near: well, radius: 2}  # cava 16 canteiros na grama a até 2 tiles do poço
sell_floor: 0.8  # vende enquanto o preço do dia for pelo menos 80% da tabela
coins_reserve: 10
# A base de comida: enquanto é pobre, todos os canteiros ficam com a cultura barata que se come e
# amadurece rápido; com capital, metade vai para a melhor conta. Sem isso, o script gasta o capital
# em tomate, come tudo e fica sem semente nem moeda (o soak de 20/out mostrou).
food_crop: rabanete
food_plots: 10  # com capital
upgrade_from: 250  # moedas a partir das quais a melhor conta entra; antes, só a base
big_can_after_seeds: true  # o regador grande só quando sobra depois das sementes de todos os canteiros
big_can: {kind: watering_can_large, item: watering_can_large, price: 150}
small_can: watering_can

kinds:
  plot: plot
  well: well
  chest: chest
  sell_box: sell_box
  kiosk: kiosk
  stove: stove
  can: watering_can

stages: {ripe: madura, withered: murcha}
rain: rain

# A Morada do Sol (ADR-0067): o calendário de plantio do manual (visível) e o horário do quiosque.
# Sem a estação na foto (as fazendas 1 e 2), nada disto entra na conta.
season_pace: {boa: 1.0, fraca: 0.5, parada: 0.0}
calendar:
  milho: {primavera: boa, verao: boa, outono: fraca, inverno: parada}
  melancia: {primavera: boa, verao: boa, outono: parada, inverno: parada}
  mandioca: {primavera: boa, verao: boa, outono: fraca, inverno: fraca}
  couve: {primavera: fraca, verao: parada, outono: boa, inverno: boa}
  abobora: {primavera: boa, verao: boa, outono: fraca, inverno: parada}
  tomate: {primavera: boa, verao: fraca, outono: boa, inverno: parada}
  batata: {primavera: fraca, verao: parada, outono: boa, inverno: boa}
  cenoura: {primavera: fraca, verao: parada, outono: boa, inverno: boa}
  rabanete: {primavera: boa, verao: fraca, outono: boa, inverno: boa}
  alho: {primavera: parada, verao: parada, outono: boa, inverno: boa}
  morango: {primavera: fraca, verao: parada, outono: boa, inverno: boa}
kiosk_hours: {opens: "08:00", closes: "18:00"}

