# Catálogo de ferramentas da mente do gênero farm (ADR-0059): uma por ação do cartucho, com as
# descrições em português. Duração e energia repetem o `actions` do farm.yaml do cartucho, e um
# teste confere que batem. Toda ferramenta ganha o campo `intent`, que a mente acrescenta.
# `move` e `wait` são ações do kernel: andar leva 1 minuto na fazenda (ADR-0057); esperar dura o
# que se pedir.
tools:
  - name: move_near
    action: move
    description: >-
      Andar até ficar ao lado de uma coisa (um canteiro, o poço, o baú, a caixa de vendas, o
      quiosque, a cama), pelo id dela; o mundo escolhe o tile e o caminho. Na fazenda qualquer
      trajeto leva 1 minuto.
    params:
      - name: near
        type: string
        description: "o id da entidade (ex.: plot-e-03, well, chest, sell-box, kiosk, bed)"
  - name: move_to
    action: move
    description: >-
      Andar até um tile pelas coordenadas; o tile precisa ser pisável e alcançável.
    params:
      - {name: x, type: integer, description: "a coluna, da esquerda para a direita"}
      - {name: y, type: integer, description: "a linha, de cima para baixo"}
    shape: {target: {x: $x, y: $y}}
  - name: plant
    description: >-
      Plantar uma semente num canteiro vazio ao seu lado. Gasta a semente da cultura, que precisa
      estar no seu inventário.
    duration: 5
    energy: 2
    params:
      - {name: target, type: string, description: "o id do canteiro (kind plot)"}
      - {name: crop, type: string, description: "a cultura", enum: [rabanete, batata, abobora]}
  - name: water
    description: >-
      Regar o canteiro ao seu lado com o regador, que gasta 1 carga; o canteiro precisa ter
      planta. A chuva rega todos os canteiros de graça.
    duration: 2
    energy: 2
    params:
      - {name: target, type: string, description: "o id do canteiro"}
  - name: refill
    description: >-
      Encher o regador no poço ao seu lado (fica com 10 cargas). Só o poço enche o regador.
    duration: 3
    energy: 1
    params:
      - {name: target, type: string, description: "o id do poço"}
  - name: harvest
    description: >-
      Colher um canteiro ao seu lado com a planta madura: rende 1 unidade da colheita no seu
      inventário e deixa o canteiro vazio.
    duration: 3
    energy: 1
    params:
      - {name: target, type: string, description: "o id do canteiro"}
  - name: clear
    description: >-
      Limpar um canteiro ao seu lado com a planta murcha, deixando-o vazio para plantar de novo.
    duration: 3
    energy: 2
    params:
      - {name: target, type: string, description: "o id do canteiro"}
  - name: eat
    description: >-
      Comer uma colheita do seu inventário; reduz a fome (rabanete 25, batata 35, abóbora 50).
    duration: 10
    energy: 0
    params:
      - {name: item, type: string, description: "a comida", enum: [rabanete, batata, abobora]}
  - name: deposit
    description: >-
      Guardar itens do seu inventário no baú ao seu lado.
    duration: 1
    energy: 0
    params:
      - {name: target, type: string, description: "o id do baú"}
      - name: item
        type: string
        description: "o item"
        enum: [rabanete, batata, abobora, semente_rabanete, semente_batata, semente_abobora]
      - {name: qty, type: integer, description: "quantas unidades, 1 ou mais"}
  - name: withdraw
    description: >-
      Pegar itens do baú ao seu lado para o seu inventário.
    duration: 1
    energy: 0
    params:
      - {name: target, type: string, description: "o id do baú"}
      - name: item
        type: string
        description: "o item"
        enum: [rabanete, batata, abobora, semente_rabanete, semente_batata, semente_abobora]
      - {name: qty, type: integer, description: "quantas unidades, 1 ou mais"}
  - name: sell
    description: >-
      Pôr colheitas do seu inventário na caixa de vendas ao seu lado. O comprador recolhe a caixa
      às 22:00 e paga em moedas às 06:00 (rabanete 25, batata 50, abóbora 120 cada).
    duration: 1
    energy: 0
    params:
      - {name: target, type: string, description: "o id da caixa de vendas"}
      - {name: item, type: string, description: "a colheita", enum: [rabanete, batata, abobora]}
      - {name: qty, type: integer, description: "quantas unidades, 1 ou mais"}
  - name: buy
    description: >-
      Comprar sementes no quiosque ao seu lado, aberto das 08:00 às 18:00, com moedas do seu
      inventário (semente_rabanete 10, semente_batata 20, semente_abobora 40 cada).
    duration: 2
    energy: 0
    params:
      - {name: target, type: string, description: "o id do quiosque"}
      - name: item
        type: string
        description: "a semente"
        enum: [semente_rabanete, semente_batata, semente_abobora]
      - {name: qty, type: integer, description: "quantas unidades, 1 ou mais"}
  - name: sleep
    description: >-
      Dormir na cama ao seu lado. À noite (das 20:00 às 06:00) dorme até as 06:00; de dia é um
      cochilo até a energia encher. A cama recupera 12,5 de energia por hora. Não dá para acordar
      antes.
    params:
      - {name: target, type: string, description: "o id da cama"}
  - name: sleep_here
    action: sleep
    description: >-
      Dormir onde está, no chão: recupera só 5 de energia por hora, com as mesmas regras de
      horário da cama. Serve quando a cama está longe e já é tarde.
    shape: {}
  - name: wait
    description: >-
      Esperar parado, sem gastar nada além do tempo; entre 1 e 60 minutos. Serve para deixar uma
      planta crescer, o quiosque abrir ou o dia virar.
    params:
      - {name: ticks, type: integer, description: "quantos minutos, de 1 a 60"}
