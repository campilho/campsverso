  - {event: campsverso.action.accepted.v1, where: {action: wait}, text: "{avatar_id} espera {params.ticks} min"}
  - {event: campsverso.action.accepted.v1, where: {action: plant}, text: "{avatar_id} vai plantar {params.crop} no {params.target} · {intent}"}
  - {event: campsverso.action.accepted.v1, where: {action: plant}, text: "{avatar_id} vai plantar {params.crop} no {params.target}"}
  - {event: campsverso.action.accepted.v1, where: {action: water}, text: "{avatar_id} vai regar o {params.target} · {intent}"}
  - {event: campsverso.action.accepted.v1, where: {action: water}, text: "{avatar_id} vai regar o {params.target}"}
  - {event: campsverso.action.accepted.v1, where: {action: harvest}, text: "{avatar_id} vai colher o {params.target} · {intent}"}
