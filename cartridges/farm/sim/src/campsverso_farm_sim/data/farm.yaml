  - {event: campsverso.action.accepted.v1, where: {action: clear}, text: "{avatar_id} vai limpar o {params.target} · {intent}"}
  - {event: campsverso.action.accepted.v1, where: {action: clear}, text: "{avatar_id} vai limpar o {params.target}"}
