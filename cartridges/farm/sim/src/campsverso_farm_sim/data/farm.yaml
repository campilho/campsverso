  - {event: campsverso.action.accepted.v1, where: {action: refill}, text: "{avatar_id} vai encher o regador"}
  - {event: campsverso.action.accepted.v1, where: {action: deposit}, text: "{avatar_id} vai guardar {params.item} no baú · {intent}"}
