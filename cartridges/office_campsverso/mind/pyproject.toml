[project]
name = "campsverso-office-campsverso-mind"
version = "0.1.0.dev0"
description = "A mente do Tiago, o dev do escritório: o cartão de identidade do cenário office_campsverso sobre a mente do gênero office (ADR-0080)."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "campsverso-mind",
  "campsverso-office-mind",
]

[project.entry-points."campsverso.minds"]
tiago_escritorio = "campsverso_office_campsverso_mind:mind"
kenji_escritorio = "campsverso_office_campsverso_mind:kenji"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
