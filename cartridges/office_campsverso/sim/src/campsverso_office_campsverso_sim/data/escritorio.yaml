# O escritório do Campsverso (ADR-0077, ADR-0078): a sala, o elenco e o calendário.
# Os números ficam na bíblia do escritório (docs/arquitetura/escritorio-campsverso-biblia.md).

office:
  door: { x: 9, y: 15 } # o tile do corredor por onde se entra e se sai
  schedule:
    workdays: [1, 2, 3, 4, 5]
    opens: "09:00"
    lunch: ["12:00", "13:00"]
    lunch_where: copa # o dev almoça na copa, pela rotina (ADR-0080)
    lunch_tail_minutes: 5 # comer acaba às 12:55: jogar fora e voltar à mesa (ADR-0082)
    closes: "18:00"
    # A convocação (a parte 5 do M25): o usuário trabalha nos fins de semana e feriados; ao
    # entrar como o gerente fora do expediente, o Camps vem. O resto vem do gênero.
    on_call:
      enabled: true
      on_manager_enter: true
    # Os feriados nacionais (o expediente não abre).
    holidays:
      "2026-11-02": Finados
      "2026-11-15": Proclamação da República
      "2026-11-20": Dia Nacional de Zumbi e da Consciência Negra
      "2026-12-25": Natal
      "2027-01-01": Confraternização Universal
      "2027-03-26": Sexta-feira Santa
      "2027-04-21": Tiradentes
      "2027-05-01": Dia do Trabalhador
      "2027-09-07": Independência
      "2027-10-12": Nossa Senhora Aparecida
      "2027-11-02": Finados
      "2027-11-15": Proclamação da República
      "2027-11-20": Dia Nacional de Zumbi e da Consciência Negra
      "2027-12-25": Natal

# Os robôs da bancada (o plano do M24, §4): ferramentas, nunca LLM. Cada linha põe um robô num
# apoio da bancada (no cubículo ao lado do dev), na ordem, até três. O dev o chama na oficina com
# `chamar_robo`: o módulo Python roda no espaço de trabalho dele, sem rede e sem escrever fora dele,
# com os argumentos que o dev der (`python -m <modulo> <argumentos>`). Uma linha:
#   - nome: testador                      # minúsculas, sem espaço; o id do robô é robo-<nome>
#     modulo: tools.robos.testador        # um módulo do repositório
#     descricao: Roda os testes que cobrem os caminhos dados e devolve um resumo curto.
#     reserva: [tools/robos/tests]        # opcional: com estes argumentos, o dev-script (o script
#                                         # de reserva, sem modelo) o chama antes de entregar
robos:
  - nome: testador
    modulo: tools.robos.testador
    descricao: Roda os testes que cobrem os caminhos dados e devolve um resumo curto.
    reserva: [tools/robos/tests]  # os testes da própria bancada: rápidos e em todo clone
  - nome: briefing
    modulo: tools.robos.briefing
    descricao: Monta o briefing de uma sessão do Claude Code a partir do pedido e das notas da memória.

# O elenco (ADR-0077): o dev é sempre um LLM ou um script; o humano entra como o gerente.
cast:
  - id: camps
    name: Camps
    role: dev
    controller: { type: script, id: script/dev }
    accepts: [llm, script, replay]
  - id: gerente
    name: Gerente
    role: gerente
    controller: { type: script, id: script/gerente-fora } # fora do escritório até alguém o assumir
    accepts: [human, script, replay]
    enters_at_door: true
  - id: vigia
    name: Vigia
    role: vigia
    controller: { type: script, id: script/vigia }
    accepts: [script, replay]
