  "campsverso_gateway",
  "campsverso_archiver",
  "campsverso_budget",
  "campsverso_farm_sim",
  "campsverso_farm_script",
  "campsverso_farm_camps_sim",
  "campsverso_farm_boavista_sim",
  "campsverso_farm_morada_do_sol_sim",
  "campsverso_farm_mind",
  "campsverso_farm_camps_mind",
  "campsverso_farm_boavista_mind",
  "campsverso_farm_morada_do_sol_mind",
  "campsverso_tools",
  "campsverso_testkit",
]

[[tool.importlinter.contracts]]
name = "A mente só conhece a porta de modelo: nem serviços, nem adaptadores, nem cartuchos (ADR-0059)"
type = "forbidden"
source_modules = ["campsverso_mind"]
forbidden_modules = [
