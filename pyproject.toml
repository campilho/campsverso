[project]
name = "campsverso"
version = "0.1.0.dev0"
description = "Plataforma de simulação orientada a eventos para agentes autônomos em mundos 2D."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "campsverso-contracts",
  "campsverso-ports",
  "campsverso-cartridge-api",
  "campsverso-adapters",
  "campsverso-world-view",
  "campsverso-mind",
  "campsverso-economy",
  "campsverso-climate",
  "campsverso-kernel",
  "campsverso-perception",
  "campsverso-controller-runner",
  "campsverso-gateway",
  "campsverso-archiver",
  "campsverso-budget",
  "campsverso-farm-sim",
  "campsverso-farm-script",
  "campsverso-farm-camps-sim",
  "campsverso-farm-boavista-sim",
  "campsverso-farm-boavista-mind",
  "campsverso-farm-morada-do-sol-sim",
  "campsverso-farm-morada-do-sol-mind",
  "campsverso-farm-mind",
  "campsverso-farm-camps-mind",
  "campsverso-tools",
  "campsverso-testkit",
]

[dependency-groups]
dev = [
  "ruff>=0.17",
  "pyright>=1.1.414",
  "pytest>=8",
  "pytest-asyncio>=1",
  "hypothesis>=6",
  "import-linter>=2",
  "types-jsonschema",
  "types-pyyaml",
  "honcho>=2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/contracts-py",
  "libs/*",
  "services/*",
  "cartridges/farm/sim",
  "cartridges/farm/script",
  "cartridges/farm/mind",
  "cartridges/farm_camps/sim",
  "cartridges/farm_camps/mind",
  "cartridges/farm_boavista/sim",
  "cartridges/farm_boavista/mind",
  "cartridges/farm_morada_do_sol/sim",
  "cartridges/farm_morada_do_sol/mind",
  "tools/contracts",
  "tests/support",
]

[tool.uv.sources]
campsverso-contracts = { workspace = true }
campsverso-ports = { workspace = true }
campsverso-cartridge-api = { workspace = true }
campsverso-adapters = { workspace = true }
campsverso-world-view = { workspace = true }
campsverso-mind = { workspace = true }
campsverso-economy = { workspace = true }
campsverso-climate = { workspace = true }
campsverso-kernel = { workspace = true }
campsverso-perception = { workspace = true }
campsverso-controller-runner = { workspace = true }
campsverso-gateway = { workspace = true }
campsverso-archiver = { workspace = true }
campsverso-budget = { workspace = true }
campsverso-farm-sim = { workspace = true }
campsverso-farm-script = { workspace = true }
campsverso-farm-camps-sim = { workspace = true }
campsverso-farm-boavista-sim = { workspace = true }
campsverso-farm-boavista-mind = { workspace = true }
campsverso-farm-morada-do-sol-sim = { workspace = true }
campsverso-farm-morada-do-sol-mind = { workspace = true }
campsverso-farm-mind = { workspace = true }
campsverso-farm-camps-mind = { workspace = true }
campsverso-tools = { workspace = true }
campsverso-testkit = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
  "packages/contracts-py/src/campsverso_contracts/models.py",
  ".claude",  # local de cada máquina: os worktrees das tarefas do Claude Code
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "TID", "PT", "N"]

[tool.ruff.lint.isort]
known-first-party = ["campsverso_*"]

# Princípio 3: SDKs externos só em libs/adapters ou na raiz de composição (main.py).
# Pacotes do kernel e dos cartuchos ampliam esta lista no próprio pyproject (relógio de parede, random).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"nats".msg = "SDK externo: só em libs/adapters ou no main.py do serviço (princípio 3)."
"fastapi".msg = "SDK externo: só em libs/adapters ou no main.py do serviço (princípio 3)."
"starlette".msg = "SDK externo: só em libs/adapters ou no main.py do serviço (princípio 3)."
"uvicorn".msg = "SDK externo: só em libs/adapters ou no main.py do serviço (princípio 3)."
"websockets".msg = "SDK externo: só em libs/adapters ou no main.py do serviço (princípio 3)."
"sqlite3".msg = "SDK externo: só em libs/adapters ou no main.py do serviço (princípio 3)."
"anthropic".msg = "SDK externo: só em libs/adapters ou no main.py do serviço (princípio 3)."
"httpx2".msg = "SDK externo: só em libs/adapters ou no main.py do serviço (princípio 3)."

[tool.ruff.lint.per-file-ignores]
"libs/adapters/**" = ["TID251"]
"**/main.py" = ["TID251"]
"tests/e2e/**" = ["TID251"]  # os testes e2e falam com os processos de fora, como um browser

# ---------------------------------------------------------------- pyright
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["packages/contracts-py/src", "libs", "services", "cartridges", "tools/contracts", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-q"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["libs", "services", "cartridges", "tools/contracts", "tests"]

# ---------------------------------------------------------------- import-linter
# Regras de arquitetura entre pacotes internos (princípios 1 e 8; ADR-0011, ADR-0025, ADR-0031).
# Imports de SDKs externos e de relógio/random são vigiados pelo ruff (banned-api).
[tool.importlinter]
root_packages = [
  "campsverso_contracts",
  "campsverso_ports",
  "campsverso_cartridge_api",
  "campsverso_adapters",
  "campsverso_world_view",
  "campsverso_mind",
  "campsverso_economy",
  "campsverso_climate",
