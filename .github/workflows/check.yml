# Roda o mesmo `make check` da máquina local num Linux limpo, a cada push e pull request (ADR-0035).
# Dois jobs em paralelo desde 19/nov: o `make check` passou de 20 minutos no CI e o teste da tela, que
# vinha depois dele no mesmo job, era cortado pelo limite de tempo.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        # Explícito: só assim o GitHub liga o pipefail, e um make que falha dentro de "| tee" falha o
        # passo. Sem isso, o código de saída seria o do tee.
        shell: bash
    steps:
      # Actions fixadas pelo hash do commit (etiquetas podem ser movidas); a versão fica no comentário.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # make compat compara com o commit anterior

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # A versão do pnpm vem de packageManager; o Node 24 vem de devEngines (ADR-0032).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Dependências
        run: make setup

      - name: make check
        env:
          # push: compara com o topo anterior da branch; pull request: com a branch de destino.
          COMPAT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        # O log completo só aparece para quem está logado no GitHub. Se falhar, os testes que falharam
        # e o fim da saída viram uma anotação de erro, visível na página do commit e pela API pública.
        run: |
          make check 2>&1 | tee make-check.log || {
            { grep -E "^(FAILED|ERROR) " make-check.log | cut -c1-300; tail -n 60 make-check.log; } | python3 -c 'import sys; t = sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=make check falhou::" + t)'
            exit 1
          }

  # Os PRs do dev (ADR-0083): o ramo dev/pedido-N, aberto pelo publicador do escritório. O diff do PR
  # passa pela revisão da oficina na versão do main, e não na do PR: o dev não muda a regra no mesmo
  # PR que ela confere. A lista de palavras proibidas fica fora do git; o publicador já a conferiu.
  constituicao:
    name: a constituição do PR do dev
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dev/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o diff contra o main

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: A constituição, pela regra do main
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git show "$BASE:libs/adapters/src/campsverso_adapters/workshop_review.py" > "$RUNNER_TEMP/regra.py"
          git diff "$BASE...HEAD" | uv run --no-project python "$RUNNER_TEMP/regra.py"

  ui-e2e:
    name: make ui-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Dependências
        run: make setup

      # Fumaça da tela num navegador de verdade (ADR-0053): o Chromium do Playwright e as bibliotecas
      # que ele pede no Linux. Na máquina local, o teste usa o Chrome já instalado.
      - name: Navegador do Playwright
        run: pnpm --filter @campsverso/ui exec playwright install --with-deps chromium

      - name: make ui-e2e
        # Como no make check: se falhar, o fim da saída vira uma anotação pública.
        run: |
          make ui-e2e 2>&1 | tee ui-e2e.log || {
            tail -n 80 ui-e2e.log | python3 -c 'import sys; t = sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=make ui-e2e falhou::" + t)'
            exit 1
          }

      - name: Telas do teste de fumaça
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telas-ui-e2e
          path: |
            apps/ui/test-results/
            apps/ui/playwright-report/
          if-no-files-found: ignore
