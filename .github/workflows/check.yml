# Roda o mesmo `make check` da máquina local num Linux limpo, a cada push e pull request (ADR-0035).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fixadas pelo hash do commit (etiquetas podem ser movidas); a versão fica no comentário.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # make compat compara com o commit anterior

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # A versão do pnpm vem de packageManager; o Node 24 vem de devEngines (ADR-0032).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Dependências
        run: make setup

      - name: make check
        env:
          # push: compara com o topo anterior da branch; pull request: com a branch de destino.
          COMPAT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: make check
