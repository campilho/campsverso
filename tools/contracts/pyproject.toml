[project]
name = "campsverso-tools"
version = "0.1.0.dev0"
description = "Ferramentas de desenvolvimento: validação, codegen e compatibilidade dos contratos."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "jsonschema>=4.25",
  "referencing>=0.36",
  "datamodel-code-generator>=0.83",
  "pyyaml>=6",
  "rfc3339-validator>=0.1.4",
  "campsverso-world-view",  # o delta da percepção, para estimar o orçamento (ADR-0056)
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
