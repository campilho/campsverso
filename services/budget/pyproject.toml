[project]
name = "campsverso-budget"
version = "0.1.0.dev0"
description = "Guarda de orçamento: soma o custo das chamadas de modelo e pausa o mundo no teto (ADR-0058)."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "campsverso-contracts",
  "campsverso-ports",
  "campsverso-adapters",  # só o main.py (raiz de composição) importa
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
