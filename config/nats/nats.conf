# NATS do Campsverso no ambiente local (ADR-0024; plano do M2 §3).
#
# - Só escuta em 127.0.0.1. A pasta do JetStream vem da linha de comando (-sd): `make up` usa
#   data/nats/jetstream; os testes sobem outro servidor com porta (-p) e pasta próprias.
# - Um usuário por processo, com as permissões de assunto dos contratos (§6) e do escopo (A8).
# - As senhas não estão aqui: vêm de variáveis de ambiente geradas por `make secrets` em .env,
#   que fica fora do git (decisão 2 do plano do M2).
# - Cada usuário tem a sua caixa de respostas (_INBOX_<usuário>.>), para não ler as dos outros.

server_name: campsverso-local
listen: 127.0.0.1:4222

jetstream {
  max_memory_store: 64MB
  max_file_store: 10GB
}

# Operações de JetStream que nenhum serviço faz: apagar ou esvaziar streams e mensagens.
JS_DESTRUCTIVE: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>", "$JS.API.STREAM.MSG.DELETE.>"]

authorization {
  users = [
    # Kernel: único escritor dos fatos; lê os comandos do stream COMMANDS. Publica também o pulso em
    # `live`, que nenhum stream guarda (ADR-0051).
    {
      user: kernel
      password: $NATS_KERNEL_PASSWORD
      permissions: {
        publish: {
          allow: [
            "campsverso.*.world.>", "campsverso.*.agent.>",
            "campsverso.*.observer.>", "campsverso.*.internal.>",
            "campsverso.*.live.>",
            "$JS.API.>", "$JS.ACK.COMMANDS.>"
          ]
          deny: $JS_DESTRUCTIVE
        }
        subscribe: { allow: ["_INBOX_kernel.>"] }
      }
    }
    # Arquivador: lê todos os streams com consumidores duráveis; não publica fatos.
    {
      user: archiver
      password: $NATS_ARCHIVER_PASSWORD
      permissions: {
        publish: { allow: ["$JS.API.>", "$JS.ACK.>"], deny: $JS_DESTRUCTIVE }
        subscribe: { allow: ["_INBOX_archiver.>"] }
      }
    }
    # Percepção (M3): lê `world` e os pedidos de decisão em `agent`; entrega a foto de cada avatar.
    # Nunca lê `internal`: é isso que garante que nada oculto chega à foto (princípio 5).
    {
      user: perception
      password: $NATS_PERCEPTION_PASSWORD
      permissions: {
        # Só a API de consumidores dos streams WORLD e AGENT: nada de buscar mensagem por número
        # nem puxar de consumidores alheios, que abririam uma porta para `internal`.
        publish: {
          allow: [
            "campsverso.*.agent.*.perception.>",
            "$JS.API.STREAM.INFO.WORLD", "$JS.API.STREAM.INFO.AGENT",
            "$JS.API.CONSUMER.CREATE.WORLD.>", "$JS.API.CONSUMER.CREATE.AGENT.>",
            "$JS.API.CONSUMER.INFO.WORLD.*", "$JS.API.CONSUMER.INFO.AGENT.*",
            "$JS.API.CONSUMER.MSG.NEXT.WORLD.*", "$JS.API.CONSUMER.MSG.NEXT.AGENT.*",
            "$JS.ACK.WORLD.>", "$JS.ACK.AGENT.>"
          ]
        }
        subscribe: {
          allow: ["_INBOX_perception.>"]
          deny: ["campsverso.*.internal.>"]
        }
      }
    }
    # Controladores script e replay (M3): só propõem ações e só leem o que é do seu avatar, por um
    # consumidor filtrado no stream AGENT. Nunca assinam internal, world nem os comandos dos outros
    # (escopo A8; contratos §6). Na v0.1 há um avatar só; com vários agentes (v0.2), um usuário cada.
    {
      user: controller
      password: $NATS_CONTROLLER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "campsverso.*.cmd.action.propose.v1", "$JS.API.STREAM.INFO.AGENT",
            "$JS.API.CONSUMER.CREATE.AGENT.*.campsverso.*.agent.camps.>",
            "$JS.API.CONSUMER.INFO.AGENT.*", "$JS.API.CONSUMER.MSG.NEXT.AGENT.*", "$JS.ACK.AGENT.>"
          ]
        }
        subscribe: {
          allow: ["campsverso.*.agent.camps.>", "_INBOX_controller.>"]
          deny: ["campsverso.*.internal.>", "campsverso.*.world.>", "campsverso.*.cmd.>"]
        }
      }
    }
    # A mente, o controlador LLM (M10; ADR-0059): o que o controller tem, mais assumir e devolver o
    # avatar e publicar as chamadas de modelo medidas em `observer.llm.>` (ADR-0058).
    {
      user: mind
      password: $NATS_MIND_PASSWORD
      permissions: {
        publish: {
          allow: [
            "campsverso.*.cmd.action.propose.v1", "campsverso.*.cmd.avatar.possess.v1",
            "campsverso.*.cmd.avatar.release.v1", "campsverso.*.observer.llm.>",
            "$JS.API.STREAM.INFO.AGENT", "$JS.API.STREAM.INFO.OBSERVER",
            "$JS.API.CONSUMER.CREATE.AGENT.*.campsverso.*.agent.camps.>",
            "$JS.API.CONSUMER.INFO.AGENT.*", "$JS.API.CONSUMER.MSG.NEXT.AGENT.*", "$JS.ACK.AGENT.>"
          ]
        }
        subscribe: {
          allow: ["campsverso.*.agent.camps.>", "_INBOX_mind.>"]
          deny: ["campsverso.*.internal.>", "campsverso.*.world.>", "campsverso.*.cmd.>"]
        }
      }
    }
    # Gateway da UI (M4; ADR-0022, ADR-0050): lê `world`, `agent` do avatar, `internal` e `observer`
    # com consumidores duráveis, e manda à UI conforme a visão. É um processo de operador, local e
    # sem login na v0.1. Publica os comandos do relógio e, desde o M5, os do humano que joga: propor
    # ações, assumir e devolver o avatar (ADR-0051).
    {
      user: gateway
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        publish: {
          allow: [
            "campsverso.*.cmd.clock.>", "campsverso.*.cmd.action.propose.v1",
            "campsverso.*.cmd.avatar.possess.v1", "campsverso.*.cmd.avatar.release.v1",
            "$JS.API.STREAM.INFO.WORLD", "$JS.API.STREAM.INFO.AGENT",
            "$JS.API.STREAM.INFO.INTERNAL", "$JS.API.STREAM.INFO.OBSERVER",
            "$JS.API.CONSUMER.CREATE.WORLD.>", "$JS.API.CONSUMER.CREATE.INTERNAL.>",
            "$JS.API.CONSUMER.CREATE.OBSERVER.>",
            "$JS.API.CONSUMER.CREATE.AGENT.*.campsverso.*.agent.camps.>",
            "$JS.API.CONSUMER.INFO.WORLD.*", "$JS.API.CONSUMER.INFO.AGENT.*",
            "$JS.API.CONSUMER.INFO.INTERNAL.*", "$JS.API.CONSUMER.INFO.OBSERVER.*",
            "$JS.API.CONSUMER.MSG.NEXT.WORLD.*", "$JS.API.CONSUMER.MSG.NEXT.AGENT.*",
            "$JS.API.CONSUMER.MSG.NEXT.INTERNAL.*", "$JS.API.CONSUMER.MSG.NEXT.OBSERVER.*",
            "$JS.ACK.WORLD.>", "$JS.ACK.AGENT.>", "$JS.ACK.INTERNAL.>", "$JS.ACK.OBSERVER.>"
          ]
        }
        subscribe: { allow: ["_INBOX_gateway.>", "campsverso.*.live.>"] }
      }
    }
    # Guarda de orçamento (M9; ADR-0058): lê `observer.llm.>` e o `session.started` de `world` com
    # consumidores duráveis; publica `ops.budget.*` em `observer` e `cmd.clock.pause`.
    {
      user: budget
      password: $NATS_BUDGET_PASSWORD
      permissions: {
        publish: {
          allow: [
            "campsverso.*.observer.ops.>", "campsverso.*.cmd.clock.pause.v1",
            "$JS.API.STREAM.INFO.OBSERVER", "$JS.API.STREAM.INFO.WORLD",
            "$JS.API.CONSUMER.CREATE.OBSERVER.>", "$JS.API.CONSUMER.CREATE.WORLD.>",
            "$JS.API.CONSUMER.INFO.OBSERVER.*", "$JS.API.CONSUMER.INFO.WORLD.*",
            "$JS.API.CONSUMER.MSG.NEXT.OBSERVER.*", "$JS.API.CONSUMER.MSG.NEXT.WORLD.*",
            "$JS.ACK.OBSERVER.>", "$JS.ACK.WORLD.>"
          ]
        }
        subscribe: { allow: ["_INBOX_budget.>"] }
      }
    }
    # Operador: acesso total, para depurar e para os testes conferirem os streams.
    {
      user: operator
      password: $NATS_OPERATOR_PASSWORD
    }
  ]
}
