# Mundo office-campsverso-demo: o escritório numa segunda-feira de manhã, para ver o dev em
# qualquer dia (o sandbox o roda a 72×) e para o teste no navegador (ADR-0078). O escritório de
# verdade é o office-campsverso-02, em tempo real.

worldid: office-campsverso-demo
cartridge: office_campsverso
script: dev
player: gerente
avatar: tiago  # o avatar do dev-script e da mente: o dev, que nenhum humano assume (ADR-0092)
devs: [tiago, kenji]  # os devs do dev-script, um runner para cada (ADR-0093)
seed: 20261116
start: "2026-11-16T08:59:00-03:00"  # um minuto antes de o dev chegar

clock:
  mode: continuous
  scale: 72
  paused: false

helpers:
  script: escritorio
  avatars: [vigia]

# Tetos de gasto com modelos (ADR-0058, ADR-0080). No escritório, o teto do dia ou do total desliga
# a mente e a rotina conduz o dev, sem pausar o mundo; o de um pedido faz a mente largá-lo. Os
# números são provisórios, até a mente chegar (M24, parte 3); o operador os muda com o mundo vivo.
budget:
  usd_per_sim_day: 10.00  # o M26 (ADR-0089, decisão 8): uma sessão do Claude Code custa mais
  usd_per_ticket: 5.00
  usd_total: 30.00
  on_exceeded: mind_off

# A oficina do dev (ADR-0080): na entrega, o controlador roda a sessão num clone deste repositório
# (data/oficina/<mundo>/<pedido>/) e guarda o patch em data/entregas/. `make aplicar PEDIDO=N` o
# põe num ramo.
workshop: true

# A foto da percepção leva o que aconteceu desde a entrega anterior (ADR-0080): a memória do dev
# não perde, a cada 20 deltas, o que houve no meio-tempo (a devolução de um pedido).
perception:
  snapshot_events: true

minds:  # a mente com rotina do dev (ADR-0080): `make sandbox MENTE=tiago_escritorio`
  tiago:
    id: llm/tiago
    mind: tiago_escritorio  # entry point do grupo campsverso.minds (cartridges/office_campsverso/mind)
    model: claude-sonnet-5-5  # a sessão na oficina; a prova de conformidade escolhe o da criação
    # Quem programa os pedidos sem escolha na prancheta (ADR-0089, decisão 3): o nosso harness com o
    # Sonnet 5.5 até o relatório da comparação das mãos; o pedido pode escolher o Claude Code.
    hands: api
    effort: medium
    max_tokens: 8192
    cassette: {path: data/llm/office-campsverso-demo.jsonl, mode: record}
    memory: {enabled: true}  # a memória do escritório e a revisão da manhã (o plano do M24, §2.3)
