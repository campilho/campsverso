# Mundo farm-camps-01: a Fazenda do Camps da v0.1 (ADR-0038).
# Vale para criar o mundo. Um mundo que já existe continua do seu snapshot: mudar a seed ou a
# data-base aqui não o altera, e o kernel recusa a diferença.

worldid: farm-camps-01
cartridge: farm_camps
seed: 20261010
start: "2026-10-10T06:00:00-03:00"  # o dia em que o projeto começou

clock:  # estado inicial do relógio; depois, só por comandos
  mode: continuous
  scale: 72  # 1 dia simulado em 20 minutos reais
  paused: false

rules_file: null  # null: o arquivo de regras do cartucho (cartridges/farm_camps/.../rules.yaml)

budget:  # tetos de gasto com modelos (ADR-0058); ao chegar a 100%, a guarda pausa o mundo
  usd_per_sim_day: 0.60
  usd_total: 10.00

minds:  # controladores LLM, um por avatar (ADR-0059); o processo `mind` assume o avatar ao subir
  camps:
    id: llm/camps
    mind: camps  # entry point do grupo campsverso.minds (cartridges/farm_camps/mind)
    model: claude-haiku-5-5  # precisa de preço em config/env/local.yaml (ADR-0058)
    effort: low  # decisões curtas e frequentes; a reflexão do M11 sobe
    max_tokens: 1024
    cassette: {path: data/llm/farm-camps-01.jsonl, mode: record}  # live | record | replay
    memory: {enabled: true}  # o caderno (ADR-0060); o arquivo padrão é data/<mundo>/memory/<avatar>.sqlite
    reflection: {effort: medium, max_tokens: 8192}  # a reflexão da noite (o raciocínio gasta daqui); model: o das decisões
    # Lidos na partida do processo: trocar modelo, esforço ou fita é reiniciar o `mind`, entre partidas.

# Quem controla cada avatar quando o mundo começa. Vazio: o controlador padrão do cartucho
# (o fazendeiro-script). Ex.: para reexecutar uma sessão gravada num mundo novo,
#   controllers: {camps: {type: replay, id: replay/sessao}}
controllers: {}
