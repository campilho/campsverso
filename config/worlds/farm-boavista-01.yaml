# Mundo farm-boavista-01: a Fazenda Boa Vista, a fazenda 2 do M13 (ADR-0062; bíblia 2).
# Vale para criar o mundo. Um mundo que já existe continua do seu snapshot: mudar a seed ou a
# data-base aqui não o altera, e o kernel recusa a diferença.

worldid: farm-boavista-01
cartridge: farm_boavista
script: farmer2  # o fazendeiro-script 2 (bíblia 2, §11): o controlador que o make run sobe
seed: 20261019  # o dia em que a fazenda foi aprovada
start: "2026-10-10T06:00:00-03:00"

clock:  # estado inicial do relógio; depois, só por comandos
  mode: continuous
  scale: 72  # 1 dia simulado em 20 minutos reais
  paused: false

rules_file: null  # null: o arquivo de regras do cartucho (a R-001 do rio, como na fazenda 1)

budget:  # tetos de gasto com modelos (ADR-0058); ao chegar a 100%, a guarda pausa o mundo
  usd_per_sim_day: 0.60
  usd_total: 10.00

minds:  # controladores LLM, um por avatar (ADR-0059); o processo `mind` assume o avatar ao subir
  camps:
    id: llm/camps
    mind: camps_boavista  # entry point do grupo campsverso.minds (cartridges/farm_boavista/mind)
    model: claude-haiku-5-5
    effort: low
    max_tokens: 1024
    cassette: {path: data/llm/farm-boavista-01.jsonl, mode: record}  # live | record | replay
    memory: {enabled: true}
    reflection: {effort: medium, max_tokens: 16384}
