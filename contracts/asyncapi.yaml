    LlmCallCompletedV1:
      title: LlmCallCompletedV1
      description: 'Uma chamada de modelo terminou (ADR-0058): quem chamou, qual modelo, tokens, custo
        e latência. Nunca leva o prompt nem a resposta. Publicado pelo decorador da porta, não pelo adaptador.'
      type: object
      additionalProperties: false
      required:
      - controller
      - purpose
      - provider
      - model
      - prompt_sha256
      - latency_ms
      - usage
      - cost_usd
      - charged
      - stop_reason
      properties:
        controller:
          $ref: '#/components/schemas/ControllerRef'
          description: Quem fez a chamada.
        purpose:
          $ref: '#/components/schemas/Token'
          description: 'Para que a chamada serviu: decision, reflection, probe…'
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: O avatar em nome de quem se decidiu, quando houver.
        provider:
          $ref: '#/components/schemas/Token'
          description: 'O provedor do adaptador: anthropic, openrouter…'
        model:
          type: string
          pattern: ^[a-z0-9][a-z0-9._:/-]*$
          maxLength: 128
        prompt_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 'Hash do pedido canônico: identifica a chamada e a linha da fita, sem levar o prompt.'
        latency_ms:
          type: integer
          minimum: 0
        request_id:
          type: string
          maxLength: 128
          description: O id do pedido no provedor, para suporte.
        usage:
          $ref: '#/components/schemas/LlmUsage'
        cost_usd:
          type: number
          minimum: 0
          description: Custo nominal pela tabela de preços do ambiente; com conselheiro, o total.
        advisor:
          type: object
          additionalProperties: false
          required:
          - model
          - calls
          - usage
          - cost_usd
          description: 'O conselheiro que o provedor consultou dentro da chamada (ADR-0074): o modelo,
            quantas vezes, os tokens dele e o custo na tarifa dele, que já está no cost_usd.'
          properties:
            model:
              type: string
              pattern: ^[a-z0-9][a-z0-9._:/-]*$
              maxLength: 128
            calls:
              type: integer
              minimum: 1
            usage:
              $ref: '#/components/schemas/LlmUsage'
            cost_usd:
              type: number
              minimum: 0
        charged:
          type: boolean
          description: 'Falso quando a resposta veio da fita: ninguém pagou, e a guarda não conta.'
        stop_reason:
          $ref: '#/components/schemas/Token'
          description: 'Como o modelo parou: end_turn, tool_use, max_tokens, refusal…'
        effort:
          enum:
          - low
          - medium
          - high
          - xhigh
          - max
    LlmCallFailedV1:
      title: LlmCallFailedV1
      description: 'Uma chamada de modelo falhou (ADR-0058): o erro classificado, se vale repetir, e a
        latência até a falha.'
      type: object
      additionalProperties: false
      required:
      - controller
      - purpose
      - provider
      - model
      - prompt_sha256
      - latency_ms
      - error
      - message
      - retryable
      properties:
        controller:
          $ref: '#/components/schemas/ControllerRef'
          description: Quem fez a chamada.
        purpose:
          $ref: '#/components/schemas/Token'
          description: 'Para que a chamada serviu: decision, reflection, probe…'
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: O avatar em nome de quem se decidiu, quando houver.
        provider:
          $ref: '#/components/schemas/Token'
          description: 'O provedor do adaptador: anthropic, openrouter…'
        model:
          type: string
          pattern: ^[a-z0-9][a-z0-9._:/-]*$
          maxLength: 128
        prompt_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 'Hash do pedido canônico: identifica a chamada e a linha da fita, sem levar o prompt.'
        latency_ms:
          type: integer
          minimum: 0
        error:
          enum:
          - rate_limit
          - timeout
          - connection
          - auth
          - bad_request
          - server
          - cassette_miss
        message:
          type: string
          maxLength: 1000
        retryable:
          type: boolean
    MemoryBeliefFormedV1:
      title: MemoryBeliefFormedV1
      description: 'Uma crença nova (ADR-0060; contratos §8.4): o que o agente passou a acreditar, com
        quanta confiança, por que evidências e de que origem.'
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - belief_id
      - statement
      - confidence
      - evidence
      - source
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: O avatar cuja memória é esta.
        belief_id:
          $ref: '#/components/schemas/BeliefId'
        statement:
          type: string
          minLength: 1
          maxLength: 500
          description: A crença, em uma frase.
        confidence:
          $ref: '#/components/schemas/Confidence'
        evidence:
          $ref: '#/components/schemas/BeliefEvidence'
        source:
          $ref: '#/components/schemas/BeliefSource'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Por que a reflexão fez isso.
    MemoryBeliefRetractedV1:
      title: MemoryBeliefRetractedV1
      description: O agente abandonou uma crença (ADR-0060; contratos §8.4).
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - belief_id
      - statement
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: O avatar cuja memória é esta.
        belief_id:
          $ref: '#/components/schemas/BeliefId'
        statement:
          type: string
          minLength: 1
          maxLength: 500
          description: A crença, em uma frase.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Por que a reflexão fez isso.
    MemoryBeliefUpdatedV1:
      title: MemoryBeliefUpdatedV1
      description: A confiança de uma crença mudou, ou o enunciado foi refinado (ADR-0060; contratos §8.4),
        com a evidência que pesou.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - belief_id
      - statement
      - confidence
      - evidence
      - source
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: O avatar cuja memória é esta.
        belief_id:
          $ref: '#/components/schemas/BeliefId'
        statement:
          type: string
          minLength: 1
          maxLength: 500
          description: A crença, em uma frase.
        confidence:
          type: object
          additionalProperties: false
          required:
          - before
          - after
          properties:
            before:
              $ref: '#/components/schemas/Confidence'
            after:
              $ref: '#/components/schemas/Confidence'
        evidence:
          $ref: '#/components/schemas/BeliefEvidence'
        source:
          $ref: '#/components/schemas/BeliefSource'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Por que a reflexão fez isso.
    MemoryNotedV1:
      title: MemoryNotedV1
      description: 'O agente anotou algo no caderno (ADR-0060): o parâmetro `note` de uma ferramenta,
        com o tick do envelope. Publicado pela mente; é o que o operador vê no caderno.'
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - day
      - text
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: O avatar cuja memória é esta.
        day:
          $ref: '#/components/schemas/Day'
        text:
          type: string
          minLength: 1
          maxLength: 500
    MemoryReflectedV1:
      title: MemoryReflectedV1
      description: 'A reflexão de um dia terminou (ADR-0060): o resumo, o plano para amanhã e quantas
        crenças foram formadas, atualizadas e retiradas. Nunca leva o prompt: só o hash do pedido.'
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - day
      - summary
      - beliefs
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: O avatar cuja memória é esta.
        day:
          $ref: '#/components/schemas/Day'
          description: O dia refletido.
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        plan:
          type: string
          minLength: 1
          maxLength: 1000
          description: O que o agente pretende amanhã.
        beliefs:
          type: object
          additionalProperties: false
          required:
          - formed
          - updated
          - retracted
          - total
          properties:
            formed:
              type: integer
              minimum: 0
            updated:
              type: integer
              minimum: 0
            retracted:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        experiment:
          type: object
          additionalProperties: false
          required:
          - hypothesis
          - test
          - prediction
          description: O experimento que a reflexão propôs para o dia seguinte (ADR-0070).
          properties:
            hypothesis:
              type: string
              minLength: 1
              maxLength: 300
            test:
              type: string
              maxLength: 300
            prediction:
              type: string
              maxLength: 300
        experiment_result:
          type: string
          enum:
          - cumpriu
          - falhou
          - inconclusivo
          description: O veredito da reflexão sobre o experimento da noite anterior (ADR-0070).
        prompt_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hash do pedido da reflexão, o mesmo do llm.call.completed.
    OpsBudgetExceededV1:
      title: OpsBudgetExceededV1
      description: O gasto com modelos estourou um teto e a guarda pediu a pausa do mundo (ADR-0058).
        Só o operador retoma.
      type: object
      additionalProperties: false
      required:
      - scope
      - spent_usd
      - limit_usd
      - paused
      properties:
        scope:
          enum:
          - day
          - total
          description: O teto do dia simulado ou o do mundo inteiro.
        day:
          $ref: '#/components/schemas/Day'
          description: O dia simulado, quando o escopo é day.
        spent_usd:
          type: number
          minimum: 0
        limit_usd:
          type: number
          exclusiveMinimum: 0
        paused:
          type: boolean
          description: Verdadeiro quando a guarda publicou cmd.clock.pause com reason budget.
    OpsBudgetThresholdReachedV1:
      title: OpsBudgetThresholdReachedV1
      description: O gasto com modelos passou de 50, 80 ou 100% de um teto (ADR-0058). Publicado pela
        guarda de orçamento.
      type: object
      additionalProperties: false
      required:
      - scope
      - threshold_pct
      - spent_usd
      - limit_usd
      properties:
        scope:
          enum:
          - day
          - total
          description: O teto do dia simulado ou o do mundo inteiro.
        day:
          $ref: '#/components/schemas/Day'
          description: O dia simulado, quando o escopo é day.
        spent_usd:
          type: number
          minimum: 0
        limit_usd:
          type: number
          exclusiveMinimum: 0
        threshold_pct:
          enum:
          - 50
          - 80
          - 100
    PerceptionDeliveredV1:
      title: PerceptionDeliveredV1
      description: Instantâneo do que o avatar percebe, a cada pedido de decisão (ADR-0028).
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - kind
      - as_of_tick
      - view
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        kind:
          enum:
          - snapshot
        as_of_tick:
          $ref: '#/components/schemas/Tick'
        decision:
          type: object
          title: PerceptionDecision
          description: 'O pedido de decisão que esta foto responde: o motivo e quem deve responder. Basta
            este evento para o controlador agir (ADR-0048).'
          additionalProperties: false
          required:
          - reason
          - controller
          properties:
            reason:
              enum:
              - session_started
              - possessed
              - action_completed
              - action_rejected
              - action_interrupted
              - phase_changed
              - need_threshold
              - woke_up
            controller:
              $ref: '#/components/schemas/ControllerRef'
        view:
          type: object
          title: PerceptionView
          description: 'Visão genérica: o que é da fazenda chega como atributo de entidade (ADR-0025).'
          additionalProperties: false
          required:
          - clock
          - weather
          - self
          - containers
          - entities
          properties:
            clock:
              type: object
              title: ViewClock
              additionalProperties: false
              required:
              - tick
              - sim_time
              - day
              - phase
              properties:
                tick:
                  $ref: '#/components/schemas/Tick'
                sim_time:
                  type: string
                  format: date-time
                day:
                  $ref: '#/components/schemas/Day'
                phase:
                  $ref: '#/components/schemas/Token'
                date:
                  type: string
                  format: date
                  description: A data do calendário do ano acelerado (ADR-0067), à parte do simtime; ausente
                    sem ano declarado.
                season:
                  $ref: '#/components/schemas/Token'
                  description: A estação da data (primavera, verao…), declarada pelo cartucho; ausente
                    sem ano declarado.
            weather:
              type: object
              title: ViewWeather
              additionalProperties: false
              required:
              - condition
              - day
              properties:
                condition:
                  $ref: '#/components/schemas/Token'
                day:
                  $ref: '#/components/schemas/Day'
                tomorrow:
                  $ref: '#/components/schemas/Token'
                  description: O tempo de amanhã, quando a previsão já saiu (ADR-0069).
            self:
              type: object
              title: ViewSelf
              additionalProperties: false
              required:
              - entity_id
              - position
              - needs
              - asleep
              properties:
                entity_id:
                  $ref: '#/components/schemas/EntityId'
                position:
                  $ref: '#/components/schemas/Position'
                needs:
                  $ref: '#/components/schemas/Needs'
                asleep:
                  type: boolean
                action:
                  type: object
                  title: ViewAction
                  additionalProperties: false
                  required:
                  - action_id
                  - action
                  - params
                  - end_tick
                  properties:
                    action_id:
                      $ref: '#/components/schemas/ActionId'
                    action:
                      $ref: '#/components/schemas/Token'
                    params:
                      $ref: '#/components/schemas/Params'
                    end_tick:
                      $ref: '#/components/schemas/Tick'
                    applied_tick:
                      $ref: '#/components/schemas/Tick'
                      description: Tick em que a ação começou (ADR-0052).
                    interrupt:
                      $ref: '#/components/schemas/Interrupt'
                      description: O que um comando novo do mesmo controlador faz com esta ação em andamento
                        (ADR-0052).
            containers:
              type: array
              items:
                type: object
                title: ViewContainer
                additionalProperties: false
                required:
                - container_id
                - items
                properties:
                  container_id:
                    $ref: '#/components/schemas/EntityId'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemStack'
            entities:
              type: array
              items:
                type: object
                title: ViewEntity
                additionalProperties: false
                required:
                - entity_id
                - kind
                - attributes
                properties:
                  entity_id:
                    $ref: '#/components/schemas/EntityId'
                  kind:
                    $ref: '#/components/schemas/Token'
                  position:
                    $ref: '#/components/schemas/Position'
                  container_id:
                    $ref: '#/components/schemas/EntityId'
                  attributes:
                    $ref: '#/components/schemas/Attributes'
            map:
              $ref: '#/components/schemas/TerrainWindow'
              description: O terreno ao alcance do avatar, recortado ao raio (ADR-0056). Só na foto; o
                delta nunca o repete.
    PerceptionUpdatedV1:
      title: PerceptionUpdatedV1
      description: 'O delta da percepção (ADR-0028, ADR-0056): o que mudou desde a última entrega ao avatar
        e o que aconteceu no meio-tempo. Responde a um pedido de decisão como a foto, para os controladores
        que pedem deltas; a foto continua em perception.delivered.v1.'
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - since_tick
      - as_of_tick
      - decision
      - clock
      - self
      - events
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        since_tick:
          $ref: '#/components/schemas/Tick'
          description: 'O tick da entrega anterior (foto ou delta): este delta cobre o que mudou depois
            dele.'
        as_of_tick:
          $ref: '#/components/schemas/Tick'
        decision:
          $ref: '#/components/schemas/DecisionRequest'
        clock:
          $ref: '#/components/schemas/SeenClock'
          description: 'Sempre presente: o relógio agora.'
        weather:
          $ref: '#/components/schemas/SeenWeather'
          description: Só quando o clima mudou desde a entrega anterior.
        self:
          $ref: '#/components/schemas/SeenSelf'
          description: 'O próprio avatar, inteiro, sempre: é pequeno e é o que mais muda.'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/SeenContainer'
          description: Os contêineres cujo conteúdo mudou, inteiros.
        entities:
          type: array
          items:
            $ref: '#/components/schemas/SeenEntity'
          description: As entidades que apareceram ou mudaram (posição, contêiner ou atributos), com o
            registro inteiro.
        gone:
          type: array
          items:
            $ref: '#/components/schemas/EntityId'
          description: As entidades que deixaram de existir à vista do avatar desde a entrega anterior
            (removidas do mundo). As que só saíram do raio vêm em `out_of_view` (ADR-0067).
        out_of_view:
          type: array
          items:
            $ref: '#/components/schemas/EntityId'
          description: 'As entidades que saíram do raio de percepção desde a entrega anterior e continuam
            no mundo: quem lembra delas sabe que estão lá (ADR-0067).'
        events:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SeenEvent'
          description: 'O que aconteceu desde a entrega anterior, na ordem em que foi publicado: alimenta
            a memória e a narrativa (M11).'
    RulesEffectAppliedV1:
