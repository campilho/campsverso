components:
  schemas:
    Uuid7:
      title: Uuid7
      description: UUID versão 7 (RFC 9562), ordenável por tempo.
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EntityId:
      title: EntityId
      description: 'Id legível e estável de uma entidade: camps, plot-e-03, bed.'
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      maxLength: 64
    ItemId:
      title: ItemId
      description: 'Id de item ou cultura; conteúdo do cartucho, em português, sem acento: moeda, semente_rabanete.'
      type: string
      pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
      maxLength: 64
    ActionId:
      title: ActionId
      description: 'Id de ação: contador determinístico do kernel.'
      type: string
      pattern: ^act-[0-9]{6,}$
    Token:
      title: Token
      description: 'Nome definido pelo cartucho ou pelo kernel: ação, fase, estágio, necessidade, tipo
        de entidade, motivo.'
      type: string
      pattern: ^[a-z][a-z0-9_]*$
      maxLength: 64
    Semver:
      title: Semver
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
    Actor:
      title: Actor
      description: 'Quem causou: human/operator, script/farmer-v1, system/kernel.'
      type: string
      minLength: 1
      maxLength: 128
    Tick:
      title: Tick
      description: Tick do kernel (1 minuto simulado na fazenda).
      type: integer
      minimum: 0
    Day:
      title: Day
      description: Dia simulado (dia agrícola, ADR-0018), começando em 1.
      type: integer
      minimum: 1
    Position:
      title: Position
      description: Posição em tiles.
      type: object
      additionalProperties: false
      required:
      - x
      - y
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
    ItemStack:
      title: ItemStack
      type: object
      additionalProperties: false
      required:
      - item
      - qty
      properties:
        item:
          $ref: '#/components/schemas/ItemId'
        qty:
          type: integer
          minimum: 1
    ControllerType:
      title: ControllerType
      enum:
      - human
      - script
      - replay
      - llm
      - mcp
      - supervised
    ControllerRef:
      title: ControllerRef
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          $ref: '#/components/schemas/ControllerType'
        id:
          type: string
          minLength: 1
          maxLength: 128
    ClockMode:
      title: ClockMode
      description: Modos do relógio na v0.1; a pausa é um estado à parte (ADR-0026).
      enum:
      - continuous
      - max
    Scalar:
      title: Scalar
      type:
      - string
      - number
      - boolean
      - 'null'
    Attributes:
      title: Attributes
      description: 'Atributos visíveis de uma entidade (ADR-0025): nomes em snake_case, valores escalares.'
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Scalar'
    Needs:
      title: Needs
      description: Valor atual de cada necessidade (0 a 100), pelo nome definido no cartucho.
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 100
    Params:
      title: Params
      description: Parâmetros de uma ação. A forma depende da ação e é validada pelo cartucho, não por
        este schema.
      type: object
      additionalProperties: {}
    CmdActionProposeV1:
      title: CmdActionProposeV1
      description: Controlador propõe uma ação para o avatar.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - action
      - params
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        action:
          $ref: '#/components/schemas/Token'
        params:
          $ref: '#/components/schemas/Params'
        intent:
          type: string
          minLength: 1
          maxLength: 500
        at_tick:
          $ref: '#/components/schemas/Tick'
          description: Tick exato de aplicação; só aceito do controlador replay em modo máximo.
    CmdAvatarPossessV1:
      title: CmdAvatarPossessV1
      description: Pede a posse do avatar para um controlador.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - controller
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        controller:
          $ref: '#/components/schemas/ControllerRef'
    CmdAvatarReleaseV1:
      title: CmdAvatarReleaseV1
      description: Devolve o avatar ao controlador padrão do cartucho.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
    CmdClockPauseV1:
      title: CmdClockPauseV1
      description: Pede a pausa do relógio.
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          enum:
          - debug
          - maintenance
          - budget
    CmdClockResumeV1:
      title: CmdClockResumeV1
      description: Pede a retomada do relógio.
      type: object
      additionalProperties: false
      required: []
      properties: {}
    CmdClockSetModeV1:
      title: CmdClockSetModeV1
      description: Pede a troca de modo do relógio.
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/ClockMode'
        reason:
          type: string
          minLength: 1
          maxLength: 200
    CmdClockSetScaleV1:
      title: CmdClockSetScaleV1
      description: Pede a troca de escala do relógio.
      type: object
      additionalProperties: false
      required:
      - scale
      - reason
      properties:
        scale:
          type: number
          exclusiveMinimum: 0
        reason:
          enum:
          - operator
          - experiment
          - budget
          - human
    CmdClockStepV1:
      title: CmdClockStepV1
      description: Avança N ticks com o relógio pausado.
      type: object
      additionalProperties: false
      required:
      - ticks
      properties:
        ticks:
          type: integer
          minimum: 1
          maximum: 1440
    CmdRulesToggleV1:
      title: CmdRulesToggleV1
      description: Pede a alternância de uma regra (ADR-0015).
      type: object
      additionalProperties: false
      required:
      - rule
      - enabled
      - reason
      properties:
        rule:
          $ref: '#/components/schemas/Token'
        enabled:
          type: boolean
        params:
          $ref: '#/components/schemas/Attributes'
          description: Parâmetros da regra.
        reason:
          type: string
          minLength: 1
          maxLength: 500
        experiment_id:
          type: string
          minLength: 1
          maxLength: 64
    EnvelopeV1:
      title: EnvelopeV1
      description: 'Envelope CloudEvents 1.0 com as extensões do Campsverso (contratos §5; ADR-0012, ADR-0013,
        ADR-0031). Os nomes dos atributos seguem o CloudEvents: minúsculas sem separador (ADR-0030).'
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - time
      - datacontenttype
      - dataschema
      - worldid
      - cartridge
      - seq
      - provenance
      - visibility
      - data
      additionalProperties: false
      properties:
        specversion:
          const: '1.0'
        id:
          $ref: '#/components/schemas/Uuid7'
        source:
          type: string
          minLength: 1
          maxLength: 256
        type:
          type: string
          pattern: ^campsverso\.[a-z0-9_]+(\.[a-z0-9_]+)+\.v[0-9]+$
        time:
          type: string
          format: date-time
        subject:
          type: string
          maxLength: 256
        datacontenttype:
          const: application/json
        dataschema:
          type: string
          pattern: ^contracts://(events|commands)/[a-z0-9_]+/[a-z0-9_.]+\.v[0-9]+$
        worldid:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        cartridge:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        tick:
          type: integer
          minimum: 0
        simtime:
          type: string
          format: date-time
        seq:
          type: integer
          minimum: 0
        actor:
          type: string
          maxLength: 128
        controller:
          $ref: '#/components/schemas/ControllerType'
        controllerid:
          type: string
          maxLength: 128
        causationid:
          $ref: '#/components/schemas/Uuid7'
        correlationid:
          $ref: '#/components/schemas/Uuid7'
        provenance:
          enum:
          - simulated
          - real
          - staged
        visibility:
          enum:
          - world
          - agent
          - observer
          - internal
        traceparent:
          type: string
          maxLength: 128
        data:
          type: object
    ActionAcceptedV1:
      title: ActionAcceptedV1
      description: Ação validada e agendada; applied_tick permite o replay exato.
      type: object
      additionalProperties: false
      required:
      - action_id
      - avatar_id
      - action
      - params
      - applied_tick
      - duration_ticks
      properties:
        action_id:
          $ref: '#/components/schemas/ActionId'
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        action:
          $ref: '#/components/schemas/Token'
        params:
          $ref: '#/components/schemas/Params'
        applied_tick:
          $ref: '#/components/schemas/Tick'
        duration_ticks:
          type: integer
          minimum: 0
          description: Duração prevista.
        replaces:
          $ref: '#/components/schemas/ActionId'
          description: Ação em andamento cancelada por esta.
    ActionCompletedV1:
      title: ActionCompletedV1
      description: Ação concluída; observable é só um resumo legível.
      type: object
      additionalProperties: false
      required:
      - action_id
      - avatar_id
      - action
      - params
      - duration_ticks
      properties:
        action_id:
          $ref: '#/components/schemas/ActionId'
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        action:
          $ref: '#/components/schemas/Token'
        params:
          $ref: '#/components/schemas/Params'
        duration_ticks:
          type: integer
          minimum: 0
          description: Duração real.
        observable:
          type: array
          items:
            type: object
            title: ObservableChange
            additionalProperties: false
            required:
            - entity_id
            - property
            - before
            - after
            properties:
              entity_id:
                $ref: '#/components/schemas/EntityId'
              property:
                $ref: '#/components/schemas/Token'
              before:
                $ref: '#/components/schemas/Scalar'
              after:
                $ref: '#/components/schemas/Scalar'
    ActionEffectsExplainedV1:
      title: ActionEffectsExplainedV1
      description: Regras, inclusive ocultas, que contribuíram para o resultado de uma ação.
      type: object
      additionalProperties: false
      required:
      - action_id
      - rules_applied
      properties:
        action_id:
          $ref: '#/components/schemas/ActionId'
        rules_applied:
          type: array
          items:
            type: object
            title: RuleApplied
            additionalProperties: false
            required:
            - rule
            - version
            - hidden
            properties:
              rule:
                $ref: '#/components/schemas/Token'
              version:
                $ref: '#/components/schemas/Semver'
              hidden:
                type: boolean
              multiplier:
                type: number
          minItems: 1
    ActionFailedV1:
      title: ActionFailedV1
      description: Ação iniciada que não chegou ao fim.
      type: object
      additionalProperties: false
      required:
      - action_id
      - avatar_id
      - action
      - reason
      properties:
        action_id:
          $ref: '#/components/schemas/ActionId'
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        action:
          $ref: '#/components/schemas/Token'
        reason:
          $ref: '#/components/schemas/Token'
          description: 'Ex.: cancelled, fainted, blocked, precondition_lost.'
    ActionRejectedV1:
      title: ActionRejectedV1
      description: Ação recusada, com motivo legível por máquina.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - action
      - params
      - reason
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        action:
          $ref: '#/components/schemas/Token'
        params:
          $ref: '#/components/schemas/Params'
        reason:
          $ref: '#/components/schemas/Token'
          description: 'Ex.: not_in_control, not_adjacent, missing_item, closed, not_ripe.'
        detail:
          type: string
          minLength: 1
          maxLength: 500
    AvatarDecisionRequestedV1:
      title: AvatarDecisionRequestedV1
      description: O avatar está ocioso; o controlador com a posse responde com cmd.action.propose e o
        mesmo correlationid.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - reason
      - controller
      - needs
      - position
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        reason:
          enum:
          - session_started
          - possessed
          - action_completed
          - action_rejected
          - action_interrupted
          - phase_changed
          - need_threshold
          - woke_up
        controller:
          $ref: '#/components/schemas/ControllerRef'
          description: Quem deve responder.
        needs:
          $ref: '#/components/schemas/Needs'
          description: Valores exatos no momento do pedido.
        position:
          $ref: '#/components/schemas/Position'
    AvatarFaintedV1:
      title: AvatarFaintedV1
      description: 'O avatar desmaiou: acordado às 02:00 ou sem energia (ADR-0014).'
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - reason
      - position
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        reason:
          enum:
          - late_night
          - exhausted
        position:
          $ref: '#/components/schemas/Position'
    AvatarPossessedV1:
      title: AvatarPossessedV1
      description: Posse do avatar assumida por um controlador.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - controller
      - by
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        previous_controller:
          $ref: '#/components/schemas/ControllerRef'
          description: Ausente na abertura da sessão.
        controller:
          $ref: '#/components/schemas/ControllerRef'
        by:
          $ref: '#/components/schemas/Actor'
    AvatarReleasedV1:
      title: AvatarReleasedV1
      description: Posse devolvida ao controlador padrão do cartucho.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - previous_controller
      - controller
      - by
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        previous_controller:
          $ref: '#/components/schemas/ControllerRef'
        controller:
          $ref: '#/components/schemas/ControllerRef'
        by:
          $ref: '#/components/schemas/Actor'
    AvatarSleepEndedV1:
      title: AvatarSleepEndedV1
      description: O avatar acordou (ADR-0014). Substituído pelo v2, sem produtor desde o M2 (ADR-0042).
      deprecated: true
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - cause
      - energy
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        cause:
          enum:
          - bed
          - faint
        energy:
          type: number
          minimum: 0
          maximum: 100
    AvatarSleepEndedV2:
      title: AvatarSleepEndedV2
      description: O avatar acordou (ADR-0014, ADR-0041, ADR-0042).
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - cause
      - energy
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        cause:
          enum:
          - voluntary
          - faint
          description: 'voluntary: o controlador mandou dormir; faint: desmaio.'
        bed_id:
          $ref: '#/components/schemas/EntityId'
          description: Cama ou entidade análoga usada no sono. Ausente quando o avatar dormiu onde estava.
        energy:
          type: number
          minimum: 0
          maximum: 100
    AvatarSleepStartedV1:
      title: AvatarSleepStartedV1
      description: O avatar dormiu na cama ou desmaiou (ADR-0014). Substituído pelo v2, sem produtor desde
        o M2 (ADR-0042).
      deprecated: true
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - cause
      - position
      - wake_at_tick
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        cause:
          enum:
          - bed
          - faint
        position:
          $ref: '#/components/schemas/Position'
        wake_at_tick:
          $ref: '#/components/schemas/Tick'
    AvatarSleepStartedV2:
      title: AvatarSleepStartedV2
      description: O avatar dormiu por escolha, na cama ou onde estava, ou desmaiou (ADR-0014, ADR-0041,
        ADR-0042).
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - cause
      - position
      - wake_at_tick
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        cause:
          enum:
          - voluntary
          - faint
          description: 'voluntary: o controlador mandou dormir; faint: desmaio.'
        bed_id:
          $ref: '#/components/schemas/EntityId'
          description: Cama ou entidade análoga usada no sono. Ausente quando o avatar dorme onde está.
        position:
          $ref: '#/components/schemas/Position'
        wake_at_tick:
          $ref: '#/components/schemas/Tick'
    FarmBuyerPaidV1:
      title: FarmBuyerPaidV1
      description: Pagamento das vendas às 06:00, com o preço de cada item.
      type: object
      additionalProperties: false
      required:
      - container_id
      - items
      - total
      - day
      properties:
        container_id:
          $ref: '#/components/schemas/EntityId'
        items:
          type: array
