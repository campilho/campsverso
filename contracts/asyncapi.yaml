    WorldEntityMovedV1:
      title: WorldEntityMovedV1
      description: 'Movimento como trajeto: só esquinas e destino; a UI interpola (D1).'
      type: object
      additionalProperties: false
      required:
      - entity_id
      - action_id
      - origin
      - waypoints
      - depart_tick
      - arrival_tick
      - tiles_per_tick
      properties:
        entity_id:
          $ref: '#/components/schemas/EntityId'
        action_id:
          $ref: '#/components/schemas/ActionId'
        origin:
          $ref: '#/components/schemas/Position'
        waypoints:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          minItems: 1
          description: Pontos de inflexão do trajeto e o destino.
        depart_tick:
          $ref: '#/components/schemas/Tick'
        arrival_tick:
          $ref: '#/components/schemas/Tick'
        tiles_per_tick:
          type: number
          exclusiveMinimum: 0
    WorldEntitySpawnedV1:
      title: WorldEntitySpawnedV1
      description: 'Entidade criada: no mapa (position) ou dentro de um contêiner (container_id).'
      type: object
      additionalProperties: false
      required:
      - entity_id
      - kind
      - blocking
      properties:
        entity_id:
          $ref: '#/components/schemas/EntityId'
        kind:
          $ref: '#/components/schemas/Token'
          description: 'Tipo definido pelo cartucho: avatar, plot, bed, chest, well, kiosk, watering_can…'
        position:
          $ref: '#/components/schemas/Position'
        container_id:
          $ref: '#/components/schemas/EntityId'
        blocking:
          type: boolean
          description: Se a entidade bloqueia a passagem no mapa.
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        attributes:
          $ref: '#/components/schemas/Attributes'
          description: Estado visível inicial.
        action_id:
          $ref: '#/components/schemas/ActionId'
          description: A ação que criou a entidade em tempo de execução (um canteiro cavado; ADR-0062);
            ausente no início da sessão.
    WorldEntityStateChangedV1:
      title: WorldEntityStateChangedV1
      description: Mudança de atributos visíveis de uma entidade (ADR-0025).
      type: object
      additionalProperties: false
      required:
      - entity_id
      - changes
      properties:
        entity_id:
          $ref: '#/components/schemas/EntityId'
        changes:
          $ref: '#/components/schemas/Attributes'
        cause:
          $ref: '#/components/schemas/Token'
          description: Ação ou nome do sistema que causou a mudança.
        action_id:
          $ref: '#/components/schemas/ActionId'
    WorldEntityStoredV1:
      title: WorldEntityStoredV1
      description: Entidade guardada noutro contêiner (uma ferramenta que vai do avatar para o baú, ou
        volta), sem posição no mapa (ADR-0062).
      type: object
      additionalProperties: false
      required:
      - entity_id
      - to_container
      properties:
        entity_id:
          $ref: '#/components/schemas/EntityId'
        from_container:
          $ref: '#/components/schemas/EntityId'
          description: De onde saiu; ausente quando estava no mapa.
        to_container:
          $ref: '#/components/schemas/EntityId'
        action_id:
          $ref: '#/components/schemas/ActionId'
    WorldItemConsumedV1:
      title: WorldItemConsumedV1
      description: Item saiu do mundo.
      type: object
      additionalProperties: false
      required:
      - item
      - qty
      - container_id
      - reason
      properties:
        item:
          $ref: '#/components/schemas/ItemId'
        qty:
          type: integer
          minimum: 1
        container_id:
          $ref: '#/components/schemas/EntityId'
        reason:
          $ref: '#/components/schemas/Token'
          description: 'Ex.: eat, plant, buy_payment, buyer_collect.'
        action_id:
          $ref: '#/components/schemas/ActionId'
        expires_day:
          $ref: '#/components/schemas/Day'
          description: O dia em que o lote consumido vencia; o motivo `spoiled` é o estrago na virada
            do dia (ADR-0062).
    WorldItemCreatedV1:
      title: WorldItemCreatedV1
      description: Item surgiu num contêiner.
      type: object
      additionalProperties: false
      required:
      - item
      - qty
      - container_id
      - reason
      properties:
        item:
          $ref: '#/components/schemas/ItemId'
        qty:
          type: integer
          minimum: 1
        container_id:
          $ref: '#/components/schemas/EntityId'
        reason:
          $ref: '#/components/schemas/Token'
          description: 'Ex.: initial, harvest, buy, payment.'
        action_id:
          $ref: '#/components/schemas/ActionId'
        expires_day:
          $ref: '#/components/schemas/Day'
          description: O dia em que o lote criado vence pela validade nominal do item, quando o item tem
            validade (ADR-0062).
    WorldItemTransferredV1:
      title: WorldItemTransferredV1
      description: Item passou de um contêiner para outro.
      type: object
      additionalProperties: false
      required:
      - item
      - qty
      - from_container
      - to_container
      - reason
      properties:
        item:
          $ref: '#/components/schemas/ItemId'
        qty:
          type: integer
          minimum: 1
        from_container:
          $ref: '#/components/schemas/EntityId'
        to_container:
          $ref: '#/components/schemas/EntityId'
        reason:
          $ref: '#/components/schemas/Token'
          description: 'Ex.: deposit, withdraw, sell.'
        action_id:
          $ref: '#/components/schemas/ActionId'
        expires_day:
          $ref: '#/components/schemas/Day'
          description: O dia em que o lote movido vence pela validade nominal; com validade, o kernel
            publica um evento por lote (ADR-0062).
    WorldNeedChangedV1:
      title: WorldNeedChangedV1
      description: Valor de uma necessidade; no máximo um por hora simulada por necessidade.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - need
      - previous_value
      - value
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        need:
          $ref: '#/components/schemas/Token'
          description: 'Ex.: fome, energia.'
        previous_value:
          type: number
          minimum: 0
          maximum: 100
        value:
          type: number
          minimum: 0
          maximum: 100
    WorldNeedThresholdCrossedV1:
      title: WorldNeedThresholdCrossedV1
      description: Uma necessidade cruzou um limiar definido pelo cartucho.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - need
      - threshold
      - direction
      - value
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        need:
          $ref: '#/components/schemas/Token'
        threshold:
          type: number
          minimum: 0
          maximum: 100
        direction:
          enum:
          - up
          - down
        value:
          type: number
          minimum: 0
          maximum: 100
    WorldSessionStartedV1:
      title: WorldSessionStartedV1
      description: Mundo carregado ou retomado a partir de snapshot.
      type: object
      additionalProperties: false
      required:
      - cartridge_version
      - seed
      - tick_seconds
      - mode
      - paused
      - scale
      - resumed
      - map
      properties:
        cartridge_version:
          $ref: '#/components/schemas/Semver'
        seed:
          type: integer
          minimum: 0
          description: Seed registrada; os fluxos de RNG nomeados derivam dela.
        tick_seconds:
          type: integer
          minimum: 1
          description: Duração de um tick em segundos simulados.
        mode:
          $ref: '#/components/schemas/ClockMode'
        paused:
          type: boolean
        scale:
          type: number
          exclusiveMinimum: 0
          description: Segundos simulados por segundo real.
        resumed:
          type: boolean
          description: Verdadeiro quando o mundo foi retomado a partir de snapshot.
        map:
          type: object
          title: SessionMap
          additionalProperties: false
          required:
          - id
          - width
          - height
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z0-9_-]+$
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
            rows:
              $ref: '#/components/schemas/TerrainRows'
              description: 'O terreno do mapa inteiro, publicado uma vez (ADR-0056): quem decide passa
                a enxergar onde pode pisar.'
            legend:
              $ref: '#/components/schemas/TerrainLegend'
        affordances:
          type: array
          items:
            $ref: '#/components/schemas/Affordance'
          description: Catálogo de ações que o cartucho oferece a quem joga (ADR-0051). O menu só sugere;
            quem decide é o kernel.
        metrics:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Metric'
          description: Catálogo de métricas do dia que o cartucho declara (ADR-0054).
        labels:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/EventLabel'
          description: Os rótulos da linha do tempo que o cartucho declara (ADR-0068).
        perception:
          $ref: '#/components/schemas/PerceptionConfig'
          description: O raio de percepção declarado pelo cartucho; vale para todos os atores (ADR-0056).
    WorldSnapshotCreatedV1:
      title: WorldSnapshotCreatedV1
      description: Snapshot persistido no BlobStore.
      type: object
      additionalProperties: false
      required:
      - snapshot_id
      - ref
      - last_seq
      - sha256
      - size_bytes
      properties:
        snapshot_id:
          type: string
          minLength: 1
          maxLength: 64
        ref:
          type: string
          minLength: 1
          maxLength: 256
        last_seq:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        size_bytes:
          type: integer
          minimum: 0
    WorldWeatherChangedV1:
      title: WorldWeatherChangedV1
      description: Clima sorteado para um dia agrícola (ADR-0018).
      type: object
      additionalProperties: false
      required:
      - condition
      - day
      properties:
        condition:
          $ref: '#/components/schemas/Token'
          description: 'Ex.: sun, rain; num cenário com clima de mundo aberto, também storm e drought
            (ADR-0069).'
        day:
          $ref: '#/components/schemas/Day'
        forecast:
          type: boolean
          description: 'O tempo de um dia que ainda não chegou: a previsão, publicada na véspera (ADR-0069).'
    LiveKernelV1:
      title: LiveKernelV1
      description: 'Pulso do kernel: o tick de verdade e o relógio, a cada kernel.pulse_seconds de tempo
        real. Vai para campsverso.<mundo>.live.kernel, que nenhum stream guarda: não entra no histórico,
        no arquivo JSONL nem no replay (ADR-0051).'
      type: object
      additionalProperties: false
      required:
      - type
      - worldid
      - tick
      - sim_time
      - mode
      - scale
      - paused
      - pulse_seconds
      - sent_at
      properties:
        type:
          const: campsverso.live.kernel.v1
        worldid:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        tick:
          $ref: '#/components/schemas/Tick'
          description: O tick em que o kernel está agora, mesmo sem evento.
        sim_time:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/ClockMode'
        scale:
          type: number
          exclusiveMinimum: 0
        paused:
          type: boolean
        pulse_seconds:
          type: number
          exclusiveMinimum: 0
          description: O intervalo entre pulsos; quem escuta usa para saber quando o kernel ficou sem
            sinal.
        sent_at:
          type: string
          format: date-time
          description: Relógio de parede de quem mandou.
    RealtimeCommandV1:
      title: RealtimeCommandV1
      description: Pedido da UI para o gateway publicar um comando. O gateway monta o envelope e o valida
        contra o contrato do comando (ADR-0050).
      type: object
      additionalProperties: false
      required:
      - type
      - request_id
      - command
      - data
      properties:
        type:
          const: campsverso.realtime.command.v1
        request_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Escolhido pela UI; volta no reply.
        command:
          type: string
          pattern: ^campsverso\.cmd\.[a-z0-9_]+(\.[a-z0-9_]+)+\.v[0-9]+$
        data:
          $ref: '#/components/schemas/Params'
          description: O payload do comando, como no contrato dele.
    RealtimeReplyV1:
      title: RealtimeReplyV1
      description: 'Resposta do gateway a um command: publicado ou recusado. Quem aceita ou recusa o comando
        no mundo é o kernel, com um evento (ADR-0050).'
      type: object
      additionalProperties: false
      required:
      - type
      - request_id
      - ok
      properties:
        type:
          const: campsverso.realtime.reply.v1
        request_id:
          type: string
          minLength: 1
          maxLength: 64
        ok:
          type: boolean
        command_id:
          $ref: '#/components/schemas/Uuid7'
          description: Id do envelope publicado, quando ok.
        error:
          type: object
          title: RealtimeError
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              enum:
              - not_allowed
              - invalid_command
              - unavailable
              - invalid_message
            message:
              type: string
              minLength: 1
              maxLength: 500
    RealtimeUpdateV1:
      title: RealtimeUpdateV1
      description: 'O que mudou desde a última mensagem: um merge patch do estado (RFC 7386) e os eventos
        do intervalo, filtrados pela visão (ADR-0050).'
      type: object
      additionalProperties: false
      required:
      - type
      - patch
      - events
      properties:
        type:
          const: campsverso.realtime.update.v1
        patch:
          type: object
          description: Merge patch (RFC 7386) sobre o ObserverState; null apaga a chave.
        events:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/EnvelopeV1'
    RealtimeWelcomeV1:
      title: RealtimeWelcomeV1
      description: 'Primeira mensagem do gateway para a UI: o estado do mundo e a linha do tempo recente
        (ADR-0050).'
      type: object
      additionalProperties: false
      required:
      - type
      - worldid
      - view
      - avatar_id
      - commands
      - state
      - events
      properties:
        type:
          const: campsverso.realtime.welcome.v1
        worldid:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        view:
          enum:
          - player
          - operator
          description: 'player: world e agent do avatar; operator: também internal e observer.'
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: O avatar que esta conexão acompanha.
        commands:
          type: array
          uniqueItems: true
          description: Tipos de comando que esta conexão pode mandar.
          items:
            type: string
            pattern: ^campsverso\.cmd\.[a-z0-9_]+(\.[a-z0-9_]+)+\.v[0-9]+$
        state:
          type: object
          title: ObserverState
          description: 'O mundo como se vê de fora, montado só com eventos publicados (ADR-0050). Genérico
            e sem nada de desenho: posições em tiles, trajetos em ticks, o que é do cartucho chega como
            atributo. Não carrega null: atributo nulo é atributo ausente, porque no merge patch null apaga.'
          additionalProperties: false
          required:
          - tick
          - day
          - phase
          - clock
          - weather
          - entities
          - containers
          - motion
          - actions
          - needs
          - asleep
          - controllers
          - decisions
          properties:
            cartridge:
              $ref: '#/components/schemas/Token'
              description: Cartucho do mundo, como no envelope.
            tick:
              $ref: '#/components/schemas/Tick'
            sim_time:
              type: string
              format: date-time
              description: Hora simulada do tick mais recente.
            day:
              $ref: '#/components/schemas/Day'
            phase:
              $ref: '#/components/schemas/Token'
              description: Fase do dia; `desconhecida` antes do primeiro evento de fase.
            date:
              type: string
              format: date
              description: A data do calendário do ano acelerado (ADR-0067), da última mudança de fase;
                ausente sem ano declarado.
            season:
              $ref: '#/components/schemas/Token'
              description: A estação da data; ausente sem ano declarado.
            session:
              type: object
              title: ObserverSession
              additionalProperties: false
              required:
              - cartridge_version
              - tick_seconds
              properties:
                cartridge_version:
                  $ref: '#/components/schemas/Semver'
                tick_seconds:
                  type: integer
                  minimum: 1
                map:
                  type: object
                  title: ObserverMap
                  additionalProperties: false
                  description: O mapa do cartucho; o arquivo fica no gateway em /content/maps/<id>.tmj
                    (ADR-0050).
                  required:
                  - id
                  - width
                  - height
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^[a-z0-9_-]+$
                    width:
                      type: integer
                      minimum: 1
                    height:
                      type: integer
                      minimum: 1
                    rows:
                      $ref: '#/components/schemas/TerrainRows'
                      description: O terreno, como o kernel publicou no session.started (ADR-0056).
                    legend:
                      $ref: '#/components/schemas/TerrainLegend'
                affordances:
                  type: array
                  items:
                    $ref: '#/components/schemas/Affordance'
                  description: O catálogo de ações do session.started, para montar os menus (ADR-0051).
                metrics:
                  type: array
                  items:
                    $ref: '#/components/schemas/Metric'
                  description: O catálogo de métricas do session.started (ADR-0054).
                labels:
                  type: array
                  items:
                    $ref: '#/components/schemas/EventLabel'
                  description: Os rótulos da linha do tempo do session.started (ADR-0068).
                perception:
                  $ref: '#/components/schemas/PerceptionConfig'
            clock:
              type: object
              title: ObserverClock
              additionalProperties: false
              description: Vazio até o session.started; a pausa é estado, não modo (ADR-0026).
              properties:
                mode:
                  $ref: '#/components/schemas/ClockMode'
                scale:
                  type: number
                  exclusiveMinimum: 0
                paused:
                  type: boolean
            pulse:
              type: object
              title: ObserverPulse
              additionalProperties: false
              description: 'O último pulso do kernel (ADR-0051): o tick de verdade, mesmo sem evento.
                `alive` vira falso depois de 3 pulsos perdidos. Ausente até o primeiro pulso.'
              required:
              - tick
              - alive
              properties:
                tick:
                  $ref: '#/components/schemas/Tick'
                sim_time:
                  type: string
                  format: date-time
                alive:
                  type: boolean
            weather:
              type: object
              description: Condição do clima por dia (a chave é o número do dia).
              additionalProperties:
                $ref: '#/components/schemas/Token'
            entities:
              type: object
              additionalProperties:
                type: object
                title: ObserverEntity
                additionalProperties: false
                required:
                - kind
                - attributes
                properties:
                  kind:
                    $ref: '#/components/schemas/Token'
                    description: Tipo definido pelo cartucho; cada renderer escolhe como desenhar.
                  position:
                    $ref: '#/components/schemas/Position'
                    description: Onde está, ou onde vai estar ao fim do trajeto em `motion`.
                  container_id:
                    $ref: '#/components/schemas/EntityId'
                    description: Dentro de outra entidade (inventário), sem posição.
                  display_name:
                    type: string
                    minLength: 1
                    maxLength: 64
                  attributes:
                    $ref: '#/components/schemas/Attributes'
            containers:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
                  minimum: 1
            motion:
              type: object
              additionalProperties:
                type: object
                title: ObserverMotion
                additionalProperties: false
                description: 'Trajeto em andamento: tile a tile, a partir de depart_tick, a tiles_per_tick.'
                required:
                - path
                - depart_tick
                - tiles_per_tick
                properties:
                  path:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/Position'
                  depart_tick:
                    $ref: '#/components/schemas/Tick'
                  tiles_per_tick:
                    type: number
                    exclusiveMinimum: 0
            actions:
              type: object
              additionalProperties:
                type: object
                title: ObserverAction
                additionalProperties: false
                required:
                - action_id
                - action
                - params
                - end_tick
                properties:
                  action_id:
                    $ref: '#/components/schemas/ActionId'
                  action:
                    $ref: '#/components/schemas/Token'
                  params:
                    $ref: '#/components/schemas/Params'
                  end_tick:
                    $ref: '#/components/schemas/Tick'
                  applied_tick:
                    $ref: '#/components/schemas/Tick'
                    description: Tick em que a ação começou (ADR-0052).
                  interrupt:
                    $ref: '#/components/schemas/Interrupt'
                    description: O que um comando novo do mesmo controlador faz com esta ação em andamento
                      (ADR-0052).
                  intent:
                    type: string
                    minLength: 1
                    maxLength: 500
                    description: A intenção declarada na proposta aceita, quando o controlador a deu (ADR-0059).
            needs:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Needs'
              description: Último valor exato recebido de cada necessidade, por avatar.
            asleep:
              type: object
              additionalProperties:
                type: boolean
            sleep:
              type: object
              description: 'O sono em andamento, por avatar: quando começou, o tick previsto para acordar
                e a cama, se houver (ADR-0052). Só com `sleep.started.v2`.'
              additionalProperties:
                type: object
                title: ObserverSleep
                additionalProperties: false
                required:
                - since_tick
                - wake_at_tick
                properties:
                  since_tick:
                    $ref: '#/components/schemas/Tick'
                  wake_at_tick:
                    $ref: '#/components/schemas/Tick'
                  bed_id:
                    $ref: '#/components/schemas/EntityId'
                    description: A cama em que dorme; ausente quando dorme onde está.
            controllers:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ControllerRef'
              description: Quem controla cada avatar.
            memory:
              type: object
              description: 'O caderno de cada avatar com controlador LLM (ADR-0060): as crenças atuais,
                as últimas anotações e a última reflexão, projetados dos eventos memory.*.'
              additionalProperties:
                type: object
                title: ObserverMemory
                additionalProperties: false
                required:
                - beliefs
                - notes
                properties:
                  day:
                    $ref: '#/components/schemas/Day'
                    description: O dia da última reflexão.
                  summary:
                    type: string
                    maxLength: 2000
                  plan:
                    type: string
                    maxLength: 1000
                  beliefs:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      title: ObserverBelief
                      additionalProperties: false
                      required:
                      - belief_id
                      - statement
                      - confidence
                      properties:
                        belief_id:
                          $ref: '#/components/schemas/BeliefId'
                        statement:
                          type: string
                          maxLength: 500
                        confidence:
                          $ref: '#/components/schemas/Confidence'
                  notes:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      title: ObserverNote
                      additionalProperties: false
                      required:
                      - tick
                      - text
                      properties:
                        tick:
                          $ref: '#/components/schemas/Tick'
                        text:
                          type: string
                          maxLength: 500
            decisions:
              type: object
              additionalProperties:
                type: object
                title: ObserverDecision
                additionalProperties: false
                description: Último pedido de decisão do avatar.
                required:
                - reason
                - tick
                properties:
                  reason:
                    $ref: '#/components/schemas/Token'
                  tick:
                    $ref: '#/components/schemas/Tick'
            metrics:
              type: object
              description: As métricas dos últimos dias simulados (no máximo 8), por dia e por id; com
                agrupamento, um valor por grupo (ADR-0054).
              additionalProperties:
                type: object
                title: ObserverDayMetrics
                additionalProperties:
                  anyOf:
                  - type: number
                  - type: object
                    additionalProperties:
                      type: number
        events:
