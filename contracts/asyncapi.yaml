  sendWorldWeatherChangedV1:
    action: send
    channel:
      $ref: '#/channels/WorldWeatherChangedV1'
    messages:
    - $ref: '#/channels/WorldWeatherChangedV1/messages/WorldWeatherChangedV1'
    x-producer: kernel
  receiveRealtimeCommandV1:
    action: receive
    channel:
      $ref: '#/channels/Realtime'
    messages:
    - $ref: '#/channels/Realtime/messages/RealtimeCommandV1'
    x-producer: ui
  sendRealtimeReplyV1:
    action: send
    channel:
      $ref: '#/channels/Realtime'
    messages:
    - $ref: '#/channels/Realtime/messages/RealtimeReplyV1'
    x-producer: gateway
  sendRealtimeUpdateV1:
    action: send
    channel:
      $ref: '#/channels/Realtime'
    messages:
    - $ref: '#/channels/Realtime/messages/RealtimeUpdateV1'
    x-producer: gateway
  sendRealtimeWelcomeV1:
    action: send
    channel:
      $ref: '#/channels/Realtime'
    messages:
    - $ref: '#/channels/Realtime/messages/RealtimeWelcomeV1'
    x-producer: gateway
  sendLiveKernelV1:
    action: send
    channel:
      $ref: '#/channels/LiveKernelV1'
    messages:
    - $ref: '#/channels/LiveKernelV1/messages/LiveKernelV1'
    x-producer: kernel
components:
  schemas:
    Uuid7:
      title: Uuid7
      description: UUID versão 7 (RFC 9562), ordenável por tempo.
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    EntityId:
      title: EntityId
      description: 'Id legível e estável de uma entidade: camps, plot-e-03, bed.'
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      maxLength: 64
    ItemId:
      title: ItemId
      description: 'Id de item ou cultura; conteúdo do cartucho, em português, sem acento: moeda, semente_rabanete.'
      type: string
      pattern: ^[a-z0-9]+(_[a-z0-9]+)*$
      maxLength: 64
    ActionId:
      title: ActionId
      description: 'Id de ação: contador determinístico do kernel.'
      type: string
      pattern: ^act-[0-9]{6,}$
    Token:
      title: Token
      description: 'Nome definido pelo cartucho ou pelo kernel: ação, fase, estágio, necessidade, tipo
        de entidade, motivo.'
      type: string
      pattern: ^[a-z][a-z0-9_]*$
      maxLength: 64
    Semver:
      title: Semver
      type: string
      pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
    Actor:
      title: Actor
      description: 'Quem causou: human/operator, script/farmer-v1, system/kernel.'
      type: string
      minLength: 1
      maxLength: 128
    Tick:
      title: Tick
      description: Tick do kernel (1 minuto simulado na fazenda).
      type: integer
      minimum: 0
    Day:
      title: Day
      description: Dia simulado (dia agrícola, ADR-0018), começando em 1.
      type: integer
      minimum: 1
    Position:
      title: Position
      description: Posição em tiles.
      type: object
      additionalProperties: false
      required:
      - x
      - y
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
    ItemStack:
      title: ItemStack
      type: object
      additionalProperties: false
      required:
      - item
      - qty
      properties:
        item:
          $ref: '#/components/schemas/ItemId'
        qty:
          type: integer
          minimum: 1
        expires_in_days:
          type: integer
          description: Dias até o lote mais antigo vencer pela validade nominal, quando o item tem validade
            (ADR-0062); zero vence hoje, negativo já passou da data e ainda não estragou (o contêiner
            conserva).
    ControllerType:
      title: ControllerType
      enum:
      - human
      - script
      - replay
      - llm
      - mcp
      - supervised
    ControllerRef:
      title: ControllerRef
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          $ref: '#/components/schemas/ControllerType'
        id:
          type: string
          minLength: 1
          maxLength: 128
    ClockMode:
      title: ClockMode
      description: Modos do relógio na v0.1; a pausa é um estado à parte (ADR-0026).
      enum:
      - continuous
      - max
    Scalar:
      title: Scalar
      type:
      - string
      - number
      - boolean
      - 'null'
    Attributes:
      title: Attributes
      description: 'Atributos visíveis de uma entidade (ADR-0025): nomes em snake_case, valores escalares.'
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Scalar'
    Needs:
      title: Needs
      description: Valor atual de cada necessidade (0 a 100), pelo nome definido no cartucho.
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 100
    Params:
      title: Params
      description: Parâmetros de uma ação. A forma depende da ação e é validada pelo cartucho, não por
        este schema.
      type: object
      additionalProperties: {}
    AffordanceParam:
      title: AffordanceParam
      description: Um parâmetro que quem joga escolhe (ADR-0051). Sem `choices`, é um número inteiro.
      type: object
      additionalProperties: false
      required:
      - name
      - label
      - source
      properties:
        name:
          $ref: '#/components/schemas/Token'
          description: O nome do parâmetro na ação (crop, item, qty…).
        label:
          type: string
          minLength: 1
          maxLength: 64
        choices:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          uniqueItems: true
        source:
          enum:
          - any
          - inventory
          - target
          description: 'Onde as escolhas valem: a lista toda, o que o avatar tem ou o que a entidade clicada
            guarda.'
        minimum:
          type: integer
        default:
          type: integer
        entities:
          type: boolean
          description: 'As escolhas incluem também as entidades guardadas na fonte, pelo id: as ferramentas
            no inventário ou no baú (ADR-0068).'
    Affordance:
      title: Affordance
      description: Uma ação no menu de um tipo de entidade, ou do próprio avatar (`self`). O menu só sugere;
        quem decide é o kernel (ADR-0051).
      type: object
      additionalProperties: false
      required:
      - action
      - label
      - 'on'
      - target
      properties:
        action:
          $ref: '#/components/schemas/Token'
        label:
          type: string
          minLength: 1
          maxLength: 64
        'on':
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Token'
          description: Tipos de entidade em que a ação aparece; `self` é o próprio avatar; um tipo de
            terreno (`grass`) põe a ação no menu de um tile vazio desse terreno, e o tile vai em `target`
            como `{x, y}` (ADR-0068).
        target:
          type: boolean
          description: A entidade clicada vai no parâmetro `target`.
        params:
          type: array
          items:
            $ref: '#/components/schemas/AffordanceParam'
    Interrupt:
      title: Interrupt
      description: 'Política de interrupção de uma ação (ADR-0052): `never`, um comando novo é recusado
        com `busy`; `cancel`, cancela a ação e nada dela acontece; `partial`, interrompe e o cartucho
        grava o trabalho feito.'
      type: string
      enum:
      - never
      - cancel
      - partial
    EventLabel:
      title: EventLabel
      description: Como a linha do tempo conta um tipo de evento, declarado pelo cartucho (ADR-0068).
        Vale o rótulo mais específico (mais campos em `where`) cujos campos do texto existem no evento;
        no empate, o primeiro declarado. Sem rótulo, a tela mostra o tipo cru.
      type: object
      additionalProperties: false
      required:
      - event
      - text
      properties:
        event:
          type: string
          pattern: ^campsverso\.[a-z0-9_]+(\.[a-z0-9_]+)*\.v[0-9]+$
        where:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Scalar'
          description: Campos do evento que precisam bater; caminhos com ponto (`params.action`).
        text:
          type: string
          minLength: 1
          maxLength: 160
          description: O texto, com campos do evento entre chaves e caminhos com ponto (`plantou {params.crop}
            no {params.target}`).
    Metric:
      title: Metric
      description: Uma métrica do dia simulado, declarada pelo cartucho e contada pela projeção comum
        (ADR-0054). `count` conta um tipo de evento, ou soma um campo dele com `field` (ADR-0069); `max_need`
        guarda o pico de uma necessidade; `item` guarda a quantidade de um item com os avatares no fim
        do dia.
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - kind
      properties:
        id:
          $ref: '#/components/schemas/Token'
        label:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          type: string
          enum:
          - count
          - max_need
          - item
        field:
          type: string
          pattern: ^[a-z0-9_]+(\.[a-z0-9_]+)*$
          description: 'Num `count`, o campo numérico do evento que se soma no lugar de contar: as moedas
            recebidas, por exemplo (ADR-0069).'
        event:
          type: string
          pattern: ^campsverso\.[a-z0-9_]+(\.[a-z0-9_]+)*\.v[0-9]+$
          description: O tipo de evento contado (`count`).
        where:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Scalar'
          description: Campos do evento que precisam bater; caminhos com ponto (`params.target`).
        by:
          type: object
          title: MetricGroup
          additionalProperties: false
          required:
          - field
          properties:
            field:
              type: string
              pattern: ^[a-z0-9_]+(\.[a-z0-9_]+)*$
            attribute:
              $ref: '#/components/schemas/Token'
              description: Agrupa pelo atributo da entidade cujo id está no campo (o `group` do canteiro).
        need:
          $ref: '#/components/schemas/Token'
          description: A necessidade (`max_need`).
        item:
          $ref: '#/components/schemas/ItemId'
          description: O item (`item`).
    SeenClock:
      title: SeenClock
      type: object
      additionalProperties: false
      required:
      - tick
      - sim_time
      - day
      - phase
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        sim_time:
          type: string
          format: date-time
        day:
          $ref: '#/components/schemas/Day'
        phase:
          $ref: '#/components/schemas/Token'
        date:
          type: string
          format: date
          description: A data do calendário do ano acelerado (ADR-0067), à parte do simtime; ausente sem
            ano declarado.
        season:
          $ref: '#/components/schemas/Token'
          description: A estação da data (primavera, verao…), declarada pelo cartucho; ausente sem ano
            declarado.
    SeenWeather:
      title: SeenWeather
      type: object
      additionalProperties: false
      required:
      - condition
      - day
      properties:
        condition:
          $ref: '#/components/schemas/Token'
        day:
          $ref: '#/components/schemas/Day'
        tomorrow:
          $ref: '#/components/schemas/Token'
          description: O tempo de amanhã, quando a previsão já saiu (ADR-0069).
    SeenAction:
      title: SeenAction
      type: object
      additionalProperties: false
      required:
      - action_id
      - action
      - params
      - end_tick
      properties:
        action_id:
          $ref: '#/components/schemas/ActionId'
        action:
          $ref: '#/components/schemas/Token'
        params:
          $ref: '#/components/schemas/Params'
        end_tick:
          $ref: '#/components/schemas/Tick'
        applied_tick:
          $ref: '#/components/schemas/Tick'
          description: Tick em que a ação começou (ADR-0052).
        interrupt:
          $ref: '#/components/schemas/Interrupt'
          description: O que um comando novo do mesmo controlador faz com esta ação em andamento (ADR-0052).
    SeenSelf:
      title: SeenSelf
      description: 'O próprio avatar: posição, necessidades, se dorme e a ação em curso.'
      type: object
      additionalProperties: false
      required:
      - entity_id
      - position
      - needs
      - asleep
      properties:
        entity_id:
          $ref: '#/components/schemas/EntityId'
        position:
          $ref: '#/components/schemas/Position'
        needs:
          $ref: '#/components/schemas/Needs'
        asleep:
          type: boolean
        action:
          $ref: '#/components/schemas/SeenAction'
    SeenContainer:
      title: SeenContainer
      type: object
      additionalProperties: false
      required:
      - container_id
      - items
      properties:
        container_id:
          $ref: '#/components/schemas/EntityId'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemStack'
    SeenEntity:
      title: SeenEntity
      type: object
      additionalProperties: false
      required:
      - entity_id
      - kind
      - attributes
      properties:
        entity_id:
          $ref: '#/components/schemas/EntityId'
        kind:
          $ref: '#/components/schemas/Token'
        position:
          $ref: '#/components/schemas/Position'
        container_id:
          $ref: '#/components/schemas/EntityId'
        attributes:
          $ref: '#/components/schemas/Attributes'
    DecisionRequest:
      title: DecisionRequest
      description: 'O pedido de decisão que a entrega da percepção responde: o motivo e quem deve responder
        (ADR-0048).'
      type: object
      additionalProperties: false
      required:
      - reason
      - controller
      properties:
        reason:
          enum:
          - session_started
          - possessed
          - action_completed
          - action_rejected
          - action_interrupted
          - phase_changed
          - need_threshold
          - woke_up
        controller:
          $ref: '#/components/schemas/ControllerRef'
    SeenEvent:
      title: SeenEvent
      description: 'Um evento que o avatar percebeu desde a última entrega: o tick, o tipo e o payload,
        como foram publicados.'
      type: object
      additionalProperties: false
      required:
      - tick
      - type
      - data
      properties:
        tick:
          $ref: '#/components/schemas/Tick'
        type:
          type: string
          pattern: ^campsverso\.[a-z0-9_]+(\.[a-z0-9_]+)*\.v[0-9]+$
          maxLength: 128
        data:
          type: object
          additionalProperties: {}
    TerrainTile:
      title: TerrainTile
      type: object
      additionalProperties: false
      required:
      - kind
      - properties
      properties:
        kind:
          type: string
          pattern: ^[a-z0-9_]*$
          maxLength: 64
          description: A classe do tile no tileset (grass, river…); vazia quando o tile não tem classe.
        properties:
          $ref: '#/components/schemas/Attributes'
          description: As propriedades do tile no tileset, como passable e water.
    TerrainLegend:
      title: TerrainLegend
      description: 'Legenda do terreno: o que cada caractere das linhas significa (ADR-0056).'
      type: object
      minProperties: 1
      additionalProperties:
        $ref: '#/components/schemas/TerrainTile'
    TerrainRows:
      title: TerrainRows
      description: O terreno, uma string por linha e um caractere por tile, de cima para baixo e da esquerda
        para a direita (ADR-0056).
      type: array
      minItems: 1
      maxItems: 1024
      items:
        type: string
        minLength: 1
        maxLength: 1024
    TerrainWindow:
      title: TerrainWindow
      description: 'O terreno ao alcance do avatar: as linhas a partir de origin (o canto superior esquerdo
        da janela), com a legenda.'
      type: object
      additionalProperties: false
      required:
      - origin
      - rows
      - legend
      properties:
        origin:
          $ref: '#/components/schemas/Position'
        rows:
          $ref: '#/components/schemas/TerrainRows'
        legend:
          $ref: '#/components/schemas/TerrainLegend'
    PerceptionConfig:
      title: PerceptionConfig
      description: O que o cartucho declara sobre a percepção (ADR-0056).
      type: object
      additionalProperties: false
      required:
      - radius
      properties:
        radius:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Distância de Chebyshev, em tiles, do que um avatar enxerga; null é o mapa inteiro.
        landmarks:
          type: array
          items:
            $ref: '#/components/schemas/Token'
          uniqueItems: true
          description: 'Tipos de entidade que todo avatar enxerga além do raio: as construções fixas,
            que quem mora ali conhece (ADR-0067). Ausente: nenhum.'
        by_phase:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: O raio em cada fase do dia, por nome da fase; a fase que não aparece usa `radius`
            (ADR-0068).
        lights:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: 'Itens que, no inventário do avatar, garantem um raio mínimo: item -> raio (a lanterna;
            ADR-0068).'
    LlmUsage:
      title: LlmUsage
      description: 'Tokens de uma chamada de modelo, como o provedor os contou (ADR-0058): entrada, saída,
        lidos do cache e gravados no cache.'
      type: object
      additionalProperties: false
      required:
      - input_tokens
      - output_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_input_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
    BeliefId:
      title: BeliefId
      description: 'Id de uma crença do agente (ADR-0060): bel-0001.'
      type: string
      pattern: ^bel-[0-9a-z]+(-[0-9a-z]+)*$
      maxLength: 64
    Confidence:
      title: Confidence
      description: Quanto o agente acredita, de 0 a 1 (ADR-0060).
      type: number
      minimum: 0
      maximum: 1
    BeliefSource:
      title: BeliefSource
      description: 'De onde a crença veio (contratos §8.4): do que o agente observou, ou de quem lhe contou
        (`by`).'
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          enum:
          - observation
          - told
        by:
          type: string
          minLength: 1
          maxLength: 128
          description: Quem contou, quando `kind` é `told`.
    BeliefEvidence:
      title: BeliefEvidence
      description: 'Evidências de uma crença: ticks e fatos de uma linha, do que o agente percebeu; nunca
        o `internal`.'
      type: array
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 300
    CmdActionProposeV1:
      title: CmdActionProposeV1
      description: Controlador propõe uma ação para o avatar.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - action
      - params
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        action:
          $ref: '#/components/schemas/Token'
        params:
          $ref: '#/components/schemas/Params'
        intent:
          type: string
          minLength: 1
          maxLength: 500
        at_tick:
          $ref: '#/components/schemas/Tick'
          description: Tick exato de aplicação; só aceito do controlador replay em modo máximo.
    CmdAvatarPossessV1:
      title: CmdAvatarPossessV1
      description: Pede a posse do avatar para um controlador.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      - controller
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
        controller:
          $ref: '#/components/schemas/ControllerRef'
    CmdAvatarReleaseV1:
      title: CmdAvatarReleaseV1
      description: Devolve o avatar ao controlador padrão do cartucho.
      type: object
      additionalProperties: false
      required:
      - avatar_id
      properties:
        avatar_id:
          $ref: '#/components/schemas/EntityId'
          description: Avatar (o corpo), independente de quem o controla (ADR-0027).
    CmdClockPauseV1:
      title: CmdClockPauseV1
      description: Pede a pausa do relógio.
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          enum:
          - debug
          - maintenance
          - budget
    CmdClockResumeV1:
      title: CmdClockResumeV1
      description: Pede a retomada do relógio.
      type: object
      additionalProperties: false
      required: []
      properties: {}
    CmdClockSetModeV1:
      title: CmdClockSetModeV1
      description: Pede a troca de modo do relógio.
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/ClockMode'
        reason:
          type: string
          minLength: 1
          maxLength: 200
    CmdClockSetScaleV1:
      title: CmdClockSetScaleV1
      description: Pede a troca de escala do relógio.
      type: object
      additionalProperties: false
      required:
      - scale
      - reason
      properties:
        scale:
          type: number
          exclusiveMinimum: 0
        reason:
          enum:
          - operator
          - experiment
          - budget
          - human
    CmdClockStepV1:
      title: CmdClockStepV1
      description: Avança N ticks com o relógio pausado.
      type: object
      additionalProperties: false
      required:
      - ticks
      properties:
        ticks:
          type: integer
          minimum: 1
          maximum: 1440
    CmdRulesToggleV1:
      title: CmdRulesToggleV1
      description: Pede a alternância de uma regra (ADR-0015).
      type: object
      additionalProperties: false
      required:
      - rule
      - enabled
      - reason
      properties:
        rule:
          $ref: '#/components/schemas/Token'
        enabled:
          type: boolean
        params:
          $ref: '#/components/schemas/Attributes'
          description: Parâmetros da regra.
        reason:
          type: string
          minLength: 1
          maxLength: 500
        experiment_id:
          type: string
          minLength: 1
          maxLength: 64
    EnvelopeV1:
      title: EnvelopeV1
      description: 'Envelope CloudEvents 1.0 com as extensões do Campsverso (contratos §5; ADR-0012, ADR-0013,
        ADR-0031). Os nomes dos atributos seguem o CloudEvents: minúsculas sem separador (ADR-0030).'
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - time
      - datacontenttype
      - dataschema
      - worldid
      - cartridge
      - seq
      - provenance
      - visibility
      - data
      additionalProperties: false
      properties:
        specversion:
          const: '1.0'
        id:
          $ref: '#/components/schemas/Uuid7'
        source:
          type: string
          minLength: 1
          maxLength: 256
        type:
          type: string
          pattern: ^campsverso\.[a-z0-9_]+(\.[a-z0-9_]+)+\.v[0-9]+$
        time:
          type: string
          format: date-time
        subject:
          type: string
          maxLength: 256
        datacontenttype:
          const: application/json
        dataschema:
          type: string
          pattern: ^contracts://(events|commands)/[a-z0-9_]+/[a-z0-9_.]+\.v[0-9]+$
        worldid:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        cartridge:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        tick:
          type: integer
          minimum: 0
        simtime:
          type: string
          format: date-time
        seq:
