# GERADO por tools/contracts a partir de contracts/: não editar à mão.
asyncapi: 3.1.0
info:
  title: Campsverso
  version: 0.1.0
  description: 'GERADO por tools/contracts a partir de contracts/: não editar à mão.


    Cada mensagem viaja dentro do envelope CloudEvents 1.0 (EnvelopeV1, modo estruturado); o payload descrito
    aqui é o campo `data`.'
  license:
    name: MIT
defaultContentType: application/json
servers:
  local:
    host: localhost:4222
    protocol: nats
    description: NATS JetStream local (ADR-0024).
  gateway:
    host: 127.0.0.1:8765
    pathname: /ws
    protocol: ws
    description: WebSocket do gateway para a UI, só local na v0.1 (ADR-0050).
channels:
