        day:
          $ref: '#/components/schemas/Day'
        date:
          type: string
          format: date
          description: A data do calendário do ano acelerado (ADR-0067), à parte do simtime; ausente sem
            ano declarado.
        season:
          $ref: '#/components/schemas/Token'
          description: A estação da data (primavera, verao…), declarada pelo cartucho; ausente sem ano
