[project]
name = "campsverso-adapters"
version = "0.1.0.dev0"
description = "Adaptadores das portas (NATS, InMemory, SQLite, JSONL...). Único lugar com SDKs externos."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "campsverso-contracts",
  "campsverso-ports",
  "jsonschema>=4.25",
  "referencing>=0.36",
  "rfc3339-validator>=0.1.4",
  "pyyaml>=6",
  "nats-py>=2.16",
  "fastapi>=0.143.0",
  "uvicorn>=0.54.0",
  "websockets>=17.2",
  "anthropic>=1.15",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
