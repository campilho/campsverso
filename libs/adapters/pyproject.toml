[project]
name = "campsverso-adapters"
version = "0.1.0.dev0"
description = "Adaptadores das portas (NATS, InMemory, SQLite, JSONL...). Único lugar com SDKs externos."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "campsverso-contracts",
  "campsverso-ports",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
